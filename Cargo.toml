pdf-inspector = { version = "1.14", default-features = false }
finstack-ai-tools-filesystem = { path = "extensions/toolsets/finstack-ai-tools-filesystem", version = "2.0.0" }
finstack-ai-tools-mcp = { path = "extensions/toolsets/finstack-ai-tools-mcp", version = "2.0.0" }
finstack-ai-tools-shell = { path = "extensions/toolsets/finstack-ai-tools-shell", version = "2.0.0" }
finstack-ai-tools-subagent = { path = "extensions/toolsets/finstack-ai-tools-subagent", version = "2.0.0" }
finstack-ai-tools-skills = { path = "extensions/toolsets/finstack-ai-tools-skills", version = "2.0.0" }
finstack-ai-tools-skill-import = { path = "extensions/toolsets/finstack-ai-tools-skill-import", version = "2.0.0" }
finstack-ai-memory = { path = "extensions/context/finstack-ai-memory", version = "2.0.0" }
# Non-ASCII MCP `Mcp-Name` header sentinel encoding (`=?base64?…?=`).
finstack-ai-context-repository = { path = "extensions/context/finstack-ai-context-repository", version = "2.0.0" }
finstack-ai-middleware-compaction = { path = "extensions/middleware/finstack-ai-middleware-compaction", version = "2.0.0" }
finstack-ai-middleware-instructions = { path = "extensions/middleware/finstack-ai-middleware-instructions", version = "2.0.0" }
finstack-ai-middleware-verify = { path = "extensions/middleware/finstack-ai-middleware-verify", version = "2.0.0" }
finstack-ai-middleware-document-ingest = { path = "extensions/middleware/finstack-ai-middleware-document-ingest", version = "2.0.0" }
finstack-ai-middleware-redaction = { path = "extensions/middleware/finstack-ai-middleware-redaction", version = "2.0.0" }
# ASCII-only patterns; no unicode-* features needed. Already in-tree transitively.
regex = { version = "1.13", default-features = false, features = ["std", "perf"] }
finstack-ai-middleware-tool-policy = { path = "extensions/middleware/finstack-ai-middleware-tool-policy", version = "2.0.0" }
finstack-ai-observer-log = { path = "extensions/observers/finstack-ai-observer-log", version = "2.0.0" }
finstack-ai-observer-otel = { path = "extensions/observers/finstack-ai-observer-otel", version = "2.0.0" }
finstack-ai-observer-metrics = { path = "extensions/observers/finstack-ai-observer-metrics", version = "2.0.0" }
finstack-ai-observer-notify = { path = "extensions/observers/finstack-ai-observer-notify", version = "2.0.0" }
finstack-ai-observer-billing = { path = "extensions/observers/finstack-ai-observer-billing", version = "2.0.0" }
finstack-ai-completion-ingress = { path = "extensions/interop/finstack-ai-completion-ingress", version = "2.0.0" }
finstack-ai-remote-child = { path = "extensions/interop/finstack-ai-remote-child", version = "2.0.0" }
finstack-ai-net-guard = { path = "extensions/net/finstack-ai-net-guard", version = "2.0.0" }
finstack-ai-workflow-hitl = { path = "extensions/workflow/finstack-ai-workflow-hitl", version = "2.0.0" }
finstack-ai-workflow-local = { path = "extensions/workflow/finstack-ai-workflow-local", version = "2.0.0" }
finstack-ai-workflow-worker = { path = "extensions/workflow/finstack-ai-workflow-worker", version = "2.0.0" }
finstack-ai-knowledge = { path = "apps/finstack-knowledge", version = "2.0.0" }
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = ["trace"] }
finstack-ai-wit = { path = "plugins/finstack-ai-wit", version = "2.0.0" }
finstack-ai-plugin-host = { path = "plugins/finstack-ai-plugin-host", version = "2.0.0" }
finstack-ai-guest-sdk = { path = "plugins/finstack-ai-guest-sdk", version = "2.0.0" }
# Guest-only; do not add to kernel/runtime/SDK/host. Pin matches fixture guests.
wit-bindgen = { version = "0.57.1", default-features = false, features = ["macros", "realloc"] }
# Newest crates.io release whose MSRV is ≤ 1.97.1. Do not enable the implicit
# filesystem `cache` feature (TM-08 /  host-owned compile cache).
wasmtime = { version = "47.0.3", default-features = false, features = ["runtime", "component-model", "async", "cranelift", "std"] }
# Same line as wasmtime. Host-only; deny-by-default WASI context. Do not enable
# ambient inherit helpers as crate features ( / SEC-INV-006).
wasmtime-wasi = { version = "47.0.3", default-features = false }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde_path_to_error = "0.1.20"
# Offline draft 2020-12 validation only; keep default features off to avoid
# network resolvers (contract section 15.3 /  fixture harness).
jsonschema = { version = "0.40.2", default-features = false }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
flamegraph = "0.6.13"
# Kernel value-type dependencies ( / contract section 3.3). The kernel stores UUID
# bytes without depending on `uuid` (keeps wasm-bindgen out of ARCH001). Runtime
# owns UUIDv7 generation via injected clock/random and the `uuid` crate.
bytes = "1.12.1"
hmac = { version = "0.12", default-features = false }
sha2 = "0.10.9"
thiserror = "2.0.20"
uuid = { version = "1.24.0", default-features = false, features = ["std"] }
serde_json_canonicalizer = "0.3.2"
ciborium = "0.2.2"
half = { version = "2.7.1", default-features = false }
getrandom = "0.3.4"
futures-core = "0.3.31"
futures-util = "0.3.31"
base64 = { version = "0.22.1", default-features = false, features = ["std", "alloc"] }
reqwest = { version = "0.13.2", default-features = false, features = ["http2", "json", "native-tls", "stream"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
url = "2"
# HTML→markdown conversion for the fetch toolset (spec §4.5). License-gated
# via `cargo deny check licenses` before use; fallback is a hand-rolled
# `scraper` DOM walk if this ever fails the gate.
htmd = "0.5"
# The real parser/DOM behind `htmd`. `html5ever` is a real (non-dev)
# dependency of finstack-ai-tools-fetch: its pre-parse nesting-depth guard
# (F-4) runs html5ever's own `parse_document` against a counting `TreeSink`
# (not a hand-rolled scanner or a bare tokenizer), so the depth it measures
# is the depth htmd's tree builder actually produces.
# `markup5ever_rcdom` stays dev-only, used by that crate's differential test
# to build the real DOM and compare its depth against the guard. Both are
# already in the dependency tree (and license-cleared) via `htmd` above;
# these entries just expose the same locked versions directly.
html5ever = "0.38"
markup5ever_rcdom = "0.38"
rustix = { version = "1.1.4", default-features = false, features = ["alloc", "fs", "std"] }
tempfile = "3.27.0"
tokio = { version = "=1.51.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
pyo3 = { version = "=0.29.0" }
pyo3-build-config = { version = "=0.29.0" }
pyo3-async-runtimes = { version = "=0.29.0" }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
wasm-bindgen-test = "=0.3.77"
js-sys = "=0.3.104"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
