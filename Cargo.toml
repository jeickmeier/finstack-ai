finstack-ai-provider-anthropic = { path = "extensions/providers/finstack-ai-provider-anthropic", version = "2.0.0" }
finstack-ai-provider-openrouter = { path = "extensions/providers/finstack-ai-provider-openrouter", version = "2.0.0" }
finstack-ai-provider-gemini = { path = "extensions/providers/finstack-ai-provider-gemini", version = "2.0.0" }
