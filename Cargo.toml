[workspace]
resolver = "2"
members = [
    "crates/finstack-ai-kernel",
    "crates/finstack-ai-runtime",
    "crates/finstack-ai",
    "crates/finstack-ai-protocol",
    "crates/finstack-ai-server",
    "crates/finstack-ai-test",
    "bindings/finstack-ai-python",
    "bindings/finstack-ai-wasm",
    "extensions/stores/finstack-ai-store-memory",
    "extensions/stores/finstack-ai-store-sqlite",
    "extensions/providers/finstack-ai-provider-openai",
    "extensions/providers/finstack-ai-provider-ollama",
    "extensions/providers/finstack-ai-provider-anthropic",
    "extensions/providers/finstack-ai-provider-gateway",
    "extensions/toolsets/finstack-ai-sandbox-e2b",
    "extensions/toolsets/finstack-ai-tools-calculator",
    "extensions/toolsets/finstack-ai-tools-filesystem",
    "extensions/toolsets/finstack-ai-tools-mcp",
    "extensions/toolsets/finstack-ai-tools-shell",
    "extensions/toolsets/finstack-ai-tools-subagent",
    "extensions/toolsets/finstack-ai-tools-skills",
    "extensions/toolsets/finstack-ai-tools-skill-import",
    "extensions/context/finstack-ai-context-repository",
    "extensions/context/finstack-ai-context-memory",
    "extensions/middleware/finstack-ai-middleware-compaction",
    "extensions/middleware/finstack-ai-middleware-verify",
    "extensions/observers/finstack-ai-observer-log",
    "extensions/observers/finstack-ai-observer-otel",
    "extensions/observers/finstack-ai-observer-metrics",
    "extensions/interop/finstack-ai-remote-child",
    "extensions/workflow/finstack-ai-workflow-local",
    "extensions/workflow/finstack-ai-workflow-temporal",
    "examples/rust-minimal",
    "examples/durable-interaction",
    "fixtures/ci/model-port-leaf",
    "fixtures/ci/toolset-port-leaf",
    "fixtures/ci/extension-port-leaf",
    "plugins/finstack-ai-wit",
    "plugins/finstack-ai-plugin-host",
    "plugins/finstack-ai-guest-sdk",
]

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
panic = "unwind"
opt-level = 3
debug = false
incremental = false

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/finstack-ai/finstack-ai"
homepage = "https://github.com/finstack-ai/finstack-ai"
authors = ["finstack-ai maintainers <me@jeickmeier.com>"]
description = "Deterministic agent microkernel, runtime, and bindings"

[workspace.metadata.finstack-ai]
license-files = ["licenses/LICENSE-MIT", "licenses/LICENSE-APACHE"]

[workspace.dependencies]
finstack-ai-kernel = { path = "crates/finstack-ai-kernel", version = "1.0.0" }
finstack-ai-runtime = { path = "crates/finstack-ai-runtime", version = "1.0.0", default-features = false }
finstack-ai = { path = "crates/finstack-ai", version = "1.0.0", default-features = false }
finstack-ai-protocol = { path = "crates/finstack-ai-protocol", version = "1.0.0" }
finstack-ai-server = { path = "crates/finstack-ai-server", version = "1.0.0" }
rustls = { version = "0.23.31", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26.2", default-features = false, features = ["ring"] }
finstack-ai-test = { path = "crates/finstack-ai-test", version = "1.0.0" }
finstack-ai-store-memory = { path = "extensions/stores/finstack-ai-store-memory", version = "1.0.0" }
finstack-ai-store-sqlite = { path = "extensions/stores/finstack-ai-store-sqlite", version = "1.0.0" }
rusqlite = { version = "0.37.0", default-features = false, features = ["bundled"] }
finstack-ai-provider-openai = { path = "extensions/providers/finstack-ai-provider-openai", version = "1.0.0" }
finstack-ai-provider-ollama = { path = "extensions/providers/finstack-ai-provider-ollama", version = "1.0.0" }
finstack-ai-provider-anthropic = { path = "extensions/providers/finstack-ai-provider-anthropic", version = "1.0.0" }
finstack-ai-provider-gateway = { path = "extensions/providers/finstack-ai-provider-gateway", version = "1.0.0" }
finstack-ai-sandbox-e2b = { path = "extensions/toolsets/finstack-ai-sandbox-e2b", version = "1.0.0" }
finstack-ai-tools-calculator = { path = "extensions/toolsets/finstack-ai-tools-calculator", version = "1.0.0" }
finstack-ai-tools-filesystem = { path = "extensions/toolsets/finstack-ai-tools-filesystem", version = "1.0.0" }
finstack-ai-tools-mcp = { path = "extensions/toolsets/finstack-ai-tools-mcp", version = "1.0.0" }
finstack-ai-tools-shell = { path = "extensions/toolsets/finstack-ai-tools-shell", version = "1.0.0" }
finstack-ai-tools-subagent = { path = "extensions/toolsets/finstack-ai-tools-subagent", version = "1.0.0" }
finstack-ai-tools-skills = { path = "extensions/toolsets/finstack-ai-tools-skills", version = "1.0.0" }
finstack-ai-tools-skill-import = { path = "extensions/toolsets/finstack-ai-tools-skill-import", version = "1.0.0" }
# Non-ASCII MCP `Mcp-Name` header sentinel encoding (`=?base64?…?=`).
finstack-ai-context-repository = { path = "extensions/context/finstack-ai-context-repository", version = "1.0.0" }
finstack-ai-context-memory = { path = "extensions/context/finstack-ai-context-memory", version = "1.0.0" }
finstack-ai-middleware-compaction = { path = "extensions/middleware/finstack-ai-middleware-compaction", version = "1.0.0" }
finstack-ai-middleware-verify = { path = "extensions/middleware/finstack-ai-middleware-verify", version = "1.0.0" }
finstack-ai-observer-log = { path = "extensions/observers/finstack-ai-observer-log", version = "1.0.0" }
finstack-ai-observer-otel = { path = "extensions/observers/finstack-ai-observer-otel", version = "1.0.0" }
finstack-ai-observer-metrics = { path = "extensions/observers/finstack-ai-observer-metrics", version = "1.0.0" }
finstack-ai-remote-child = { path = "extensions/interop/finstack-ai-remote-child", version = "1.0.0" }
finstack-ai-workflow-local = { path = "extensions/workflow/finstack-ai-workflow-local", version = "1.0.0" }
finstack-ai-workflow-temporal = { path = "extensions/workflow/finstack-ai-workflow-temporal", version = "1.0.0" }
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = ["trace"] }
finstack-ai-wit = { path = "plugins/finstack-ai-wit", version = "1.0.0" }
finstack-ai-plugin-host = { path = "plugins/finstack-ai-plugin-host", version = "1.0.0" }
finstack-ai-guest-sdk = { path = "plugins/finstack-ai-guest-sdk", version = "1.0.0" }
# Guest-only; do not add to kernel/runtime/SDK/host. Pin matches fixture guests.
wit-bindgen = { version = "0.57.1", default-features = false, features = ["macros", "realloc"] }
# Newest crates.io release whose MSRV is ≤ 1.97.1. Do not enable the implicit
# filesystem `cache` feature (TM-08 / PR-051 host-owned compile cache).
wasmtime = { version = "47.0.3", default-features = false, features = ["runtime", "component-model", "async", "cranelift", "std"] }
# Same line as wasmtime. Host-only; deny-by-default WASI context. Do not enable
# ambient inherit helpers as crate features (PR-052 / SEC-INV-006).
wasmtime-wasi = { version = "47.0.3", default-features = false }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde_path_to_error = "0.1.20"
# Offline draft 2020-12 validation only; keep default features off to avoid
# network resolvers (TDD §15.3 / PR-005 fixture harness).
jsonschema = { version = "0.40.2", default-features = false }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Kernel value-type dependencies (PR-006 / TDD §3.3). The kernel stores UUID
# bytes without depending on `uuid` (keeps wasm-bindgen out of ARCH001). Runtime
# owns UUIDv7 generation via injected clock/random and the `uuid` crate.
bytes = "1.12.1"
sha2 = "0.10.9"
thiserror = "2.0.20"
uuid = { version = "1.24.0", default-features = false, features = ["std"] }
serde_json_canonicalizer = "0.3.2"
ciborium = "0.2.2"
getrandom = "0.3.4"
futures-core = "0.3.31"
futures-util = "0.3.31"
base64 = { version = "0.22.1", default-features = false, features = ["std", "alloc"] }
reqwest = { version = "0.13.2", default-features = false, features = ["http2", "json", "native-tls", "stream"] }
rustix = { version = "1.1.4", default-features = false, features = ["alloc", "fs", "std"] }
tempfile = "3.27.0"
tokio = { version = "=1.51.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
pyo3 = { version = "=0.29.0" }
pyo3-build-config = { version = "=0.29.0" }
pyo3-async-runtimes = { version = "=0.29.0" }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
