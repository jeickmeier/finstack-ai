[profile.dev]
debug = "line-tables-only"

# Unoptimized wasm32 builds of these document-parsing crates (and their
# heaviest transitive deps) exceed wasm-bindgen's per-function local-variable
# limit ("too many locals") at opt-level 0. A light optimization pass is
# enough to keep `mise run build-wasm` (default dev profile) working once
# finstack-ai-tools-document is wired into the wasm crate; keep this at the
# lowest opt-level that still succeeds.
[profile.dev.package.anydoc]
opt-level = 1

[profile.dev.package.pdf-inspector]
opt-level = 1

[profile.dev.package.lopdf]
opt-level = 1

[profile.dev.package.calamine]
opt-level = 1

[profile.test]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
panic = "unwind"
opt-level = 3
debug = false
incremental = false

# Local WASM/test builds: optimized without release LTO.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/finstack-ai/finstack-ai"
homepage = "https://github.com/finstack-ai/finstack-ai"
authors = ["finstack-ai maintainers <me@jeickmeier.com>"]
description = "Deterministic agent microkernel, runtime, and bindings"

[workspace.metadata.finstack-ai]
license-files = ["licenses/LICENSE-MIT", "licenses/LICENSE-APACHE"]

[workspace.dependencies]
finstack-ai-kernel = { path = "crates/finstack-ai-kernel", version = "2.0.0" }
