# cargo-deny policy restored by  (FIND-064-004).
# Controls: Engineering Standards §9; Threat Model TM-18; Threat Model §§12-13.

[graph]
# Scan every feature combination so optional dependencies cannot escape
# advisory, license, source, or ban policy (Eng Standards §9; TM-18).
all-features = true
no-default-features = false
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "wasm32-unknown-unknown" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Transitive via lopdf 0.42 / pdf-inspector / anydoc (document toolset).
    # Informational; no patched ttf-parser and no workspace-safe lopdf bump.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; document stack has no drop-in upgrade" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    # Transitive deps of offline `jsonschema` 0.40 ( harness; OSI-approved).
    "Unicode-3.0",
    "MIT-0",
    "Zlib",
    # PyO3 build-time target classification; LLVM exception preserves the
    # Apache-2.0 grant while allowing LLVM-style redistribution.
    "Apache-2.0 WITH LLVM-exception",
    # LLVM libFuzzer runtime linked only by the isolated cargo-fuzz workspace.
    "NCSA",
    # ed25519-dalek / curve25519-dalek (plugin-host signatures); encoding_rs
    # (wasmtime). OSI-approved.
    "BSD-3-Clause",
    # rustls / ring / webpki / untrusted. OSI-approved.
    "ISC",
]
# Additional common OSI licenses may be added when a dependency first needs them.
# Keep the allowlist tight; unmatched allowances become cargo-deny warnings.
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    # The nesting-depth guard in finstack-ai-tools-fetch (F-4) measures
    # documents by driving html5ever's *real* tree builder directly; its
    # exactness depends on resolving the SAME html5ever/markup5ever build
    # that htmd's parser uses internally. If a version bump ever caused
    # Cargo to resolve two copies, the guard would silently measure with a
    # different tree builder than the one that actually processes the
    # document, and nothing else in this workspace would catch that (the
    # differential test exercises the workspace's own markup5ever_rcdom,
    # not htmd's copy). Hard-ban a version split so `cargo deny check`
    # fails instead of merely `warn`ing via `multiple-versions`.
    { name = "html5ever", deny-multiple-versions = true },
    { name = "markup5ever", deny-multiple-versions = true },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
