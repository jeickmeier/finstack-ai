# cargo-deny policy for Phase 0 / PR-003.
# Controls: Engineering Standards §9; Threat Model TM-18; Threat Model §§12-13.

[graph]
# Scan every feature combination so optional dependencies cannot escape
# advisory, license, source, or ban policy (Eng Standards §9; TM-18).
all-features = true
no-default-features = false
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "wasm32-unknown-unknown" },
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    # Transitive deps of offline `jsonschema` 0.40 (PR-005 harness; OSI-approved).
    "Unicode-3.0",
    "MIT-0",
    "Zlib",
    # PyO3 build-time target classification; LLVM exception preserves the
    # Apache-2.0 grant while allowing LLVM-style redistribution.
    "Apache-2.0 WITH LLVM-exception",
    # LLVM libFuzzer runtime linked only by the isolated cargo-fuzz workspace.
    "NCSA",
]
# Additional common OSI licenses may be added when a dependency first needs them.
# Keep the allowlist tight; unmatched allowances become cargo-deny warnings.
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
