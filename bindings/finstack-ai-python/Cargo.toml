[package]
name = "finstack-ai-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "PyO3 bindings for the finstack-ai agent engine"
publish = false

[lib]
name = "_finstack_ai"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
# PyO3 extension modules are exercised by pytest, not rustc/rustdoc.
# rustdoc still compiles the crate for doctests and can fail with a stale
# `--extern pyo3=*.rlib` path during workspace-parallel `cargo test`.
test = false
doctest = false

[features]
default = []
benchmark-fixture = ["dep:finstack-ai-test"]
callback-fixture = ["dep:finstack-ai-test"]
extension-module = ["pyo3/extension-module"]

[dependencies]
finstack-ai = { workspace = true, default-features = false, features = ["native-tokio", "linked-all", "vendored-tls"] }
finstack-ai-context-repository = { workspace = true }
finstack-ai-memory = { workspace = true, features = ["sqlite"] }
finstack-ai-kernel = { workspace = true }
finstack-ai-middleware-document-ingest = { workspace = true }
finstack-ai-middleware-compaction = { workspace = true }
finstack-ai-middleware-instructions = { workspace = true }
finstack-ai-middleware-verify = { workspace = true }
finstack-ai-observer-log = { workspace = true }
finstack-ai-protocol = { workspace = true }
finstack-ai-provider-anthropic = { workspace = true, features = ["vendored-tls"] }
finstack-ai-provider-gemini = { workspace = true, features = ["vendored-tls"] }
finstack-ai-provider-openai = { workspace = true, features = ["vendored-tls"] }
finstack-ai-provider-ollama = { workspace = true, features = ["vendored-tls"] }
finstack-ai-provider-openrouter = { workspace = true, features = ["vendored-tls"] }
finstack-ai-store-artifact = { workspace = true, features = ["local"] }
finstack-ai-store-memory = { workspace = true }
finstack-ai-store-sqlite = { workspace = true }
finstack-ai-tools-document = { workspace = true }
finstack-ai-tools-elicitation = { workspace = true }
finstack-ai-tools-fetch = { workspace = true, features = ["vendored-tls"] }
finstack-ai-tools-skills = { workspace = true }
finstack-ai-sandbox-e2b = { workspace = true, features = ["vendored-tls"] }
finstack-ai-test = { workspace = true, optional = true }
futures-util = { workspace = true }
pyo3 = { workspace = true }
pyo3-async-runtimes = { workspace = true, features = ["tokio-runtime"] }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
pyo3-build-config = { workspace = true }

[lints]
workspace = true
