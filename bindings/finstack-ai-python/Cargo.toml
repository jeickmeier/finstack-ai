[package]
name = "finstack-ai-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "PyO3 bindings for the finstack-ai agent engine"
publish = false

[lib]
name = "_finstack_ai"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
# PyO3 extension modules are exercised by pytest, not rustc/rustdoc.
# rustdoc still compiles the crate for doctests and can fail with a stale
# `--extern pyo3=*.rlib` path during workspace-parallel `cargo test`.
test = false
doctest = false

[features]
default = []
benchmark-fixture = ["dep:finstack-ai-test"]
callback-fixture = ["dep:finstack-ai-test"]
extension-module = ["pyo3/extension-module"]

[dependencies]
finstack-ai = { workspace = true, default-features = false, features = ["native-tokio"] }
finstack-ai-provider-openai-compatible = { workspace = true, features = ["vendored-tls"] }
finstack-ai-store-memory = { workspace = true }
finstack-ai-test = { workspace = true, optional = true }
futures-util = { workspace = true }
pyo3 = { workspace = true }
pyo3-async-runtimes = { workspace = true, features = ["tokio-runtime"] }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
pyo3-build-config = { workspace = true }

[lints]
workspace = true
