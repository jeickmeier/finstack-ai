[project]
name = "finstack-ai"
version = "1.0.0"
description = "Deterministic agent engine backed by Rust"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.optional-dependencies]
pydantic = ["pydantic>=2.12.5,<3"]

[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
manifest-path = "Cargo.toml"
module-name = "finstack_ai._finstack_ai"
python-source = "python"
features = ["extension-module"]
locked = true
strip = true
exclude = ["python/**/__pycache__", "python/**/*.pyc"]

# Maturin's generated Cargo SBOM embeds the ephemeral PEP 517 extraction path,
# which makes otherwise identical wheels differ and leaks builder paths. The
# release-metadata PR owns deterministic SBOM/provenance staging.
[tool.maturin.sbom]
rust = false
auditwheel = false

[tool.pytest.ini_options]
testpaths = ["tests"]
