<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@finstack/ai harness</title>
  </head>
  <body>
    <p id="ui-tick">0</p>
    <script type="module">
      import {
        Agent,
        FinstackError,
        JsArtifactStore,
        JsClock,
        JsContextProvider,
        JsJournalStore,
        JsMiddleware,
        JsModel,
        JsObserver,
        JsRandomSource,
        JsToolset,
        buildMetadata,
        createHostClock,
        createHostRandomSource,
        createMemoryArtifactStore,
        createMemoryJournalStore,
        health,
        init,
        normalizePrebetaShape,
      } from "./dist/index.js";
      import {
        OPENAI_COMPATIBLE_DEFAULT_BASE_URL,
        createOpenAICompatibleModel,
      } from "./dist/adapters/openai-compatible.js";
      import {
        createIndexedDbArtifactStore,
        createIndexedDbJournalStore,
        createMapJournalStore,
        deleteIndexedDbStores,
      } from "./dist/adapters/indexeddb.js";
      import { connectWorker } from "./dist/worker.js";
      import {
        applyScriptedCoordinatorCommands,
        compilePortProxies,
        driveScriptedJournalHealth,
        driveScriptedModelRequest,
        driveScriptedToolCall,
        runNoopTrace,
      } from "./generated/finstack_ai_wasm.js";

      const tick = document.getElementById("ui-tick");
      let ticks = 0;
      const pulse = () => {
        ticks += 1;
        if (tick !== null) {
          tick.textContent = String(ticks);
        }
        window.requestAnimationFrame(pulse);
      };
      window.requestAnimationFrame(pulse);

      window.finstackReady = init().then(() => {
        window.finstackTest = {
          health,
          buildMetadata,
          compilePortProxies,
          runNoopTrace,
          Agent,
          FinstackError,
          JsModel,
          JsToolset,
          JsContextProvider,
          JsMiddleware,
          JsObserver,
          JsJournalStore,
          JsClock,
          JsRandomSource,
          JsArtifactStore,
          createMemoryJournalStore,
          createMemoryArtifactStore,
          createMapJournalStore,
          createIndexedDbJournalStore,
          createIndexedDbArtifactStore,
          deleteIndexedDbStores,
          inspectSession: (store, sessionId) => Agent.inspectSession(store, sessionId),
          createHostClock,
          createHostRandomSource,
          createOpenAICompatibleModel,
          openaiCompatibleDefaultBaseUrl: OPENAI_COMPATIBLE_DEFAULT_BASE_URL,
          normalizePrebetaShape,
          applyScriptedCoordinatorCommands: (commands) =>
            JSON.parse(applyScriptedCoordinatorCommands(JSON.stringify(commands))),
          driveScriptedModelRequest: async (adapter, options, signal) =>
            JSON.parse(await driveScriptedModelRequest(adapter, options, signal)),
          driveScriptedToolCall: async (adapter, options, signal) =>
            JSON.parse(await driveScriptedToolCall(adapter, options, signal)),
          driveScriptedJournalHealth: async (adapter, options) =>
            JSON.parse(await driveScriptedJournalHealth(adapter, options)),
          connectWorker,
          createAgentWorker: () =>
            new Worker("/dist/worker-fixture.js", { type: "module" }),
          uiTicks: () => ticks,
        };
      });
    </script>
  </body>
</html>
