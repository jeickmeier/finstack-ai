[package]
name = "finstack-ai-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Browser wasm-bindgen bindings for the finstack-ai engine"
publish = false

[lib]
name = "finstack_ai_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
scripted-trace = []

[dependencies]
finstack-ai = { workspace = true, default-features = false, features = ["wasm-host"] }
finstack-ai-kernel = { workspace = true }
finstack-ai-middleware-document-ingest = { workspace = true }
finstack-ai-protocol = { workspace = true }
finstack-ai-store-memory = { workspace = true }
finstack-ai-tools-document = { workspace = true }
futures-util = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[lints]
workspace = true
