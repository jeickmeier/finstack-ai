[package]
name = "finstack-ai-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/finstack-ai-runtime"
authors.workspace = true
description = "Runtime ports and effect execution for finstack-ai"

[features]
default = []
# OS process-group / Landlock / Seatbelt / job-object service. Enabled by
# `native-tokio`. Contract-only leaves (`default = []`) must not enable this:
# `rustix` and the confinement FFI stay off that graph.
confinement = ["dep:rustix"]
native-tokio = ["dep:getrandom", "dep:tokio", "confinement"]
wasm-host = []

[dependencies]
bytes = { workspace = true }
finstack-ai-kernel = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
getrandom = { workspace = true, optional = true }
futures-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
jsonschema = { workspace = true }
tokio = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["thread"], optional = true }

[dev-dependencies]
futures-util = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
