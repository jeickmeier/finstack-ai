[package]
name = "finstack-ai-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/finstack-ai-runtime"
authors.workspace = true
description = "Runtime ports and effect execution for finstack-ai"

[features]
default = []
native-tokio = ["dep:getrandom", "dep:tokio"]
wasm-host = []

[dependencies]
bytes = { workspace = true }
finstack-ai-kernel = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
getrandom = { workspace = true, optional = true }
futures-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
jsonschema = { workspace = true }
tokio = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["thread"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
