[package]
name = "finstack-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/finstack-ai"
authors.workspace = true
description = "Public SDK/facade for the finstack-ai agent engine"

[lib]
name = "finstack_ai"
path = "src/lib.rs"

[features]
default = ["native-tokio"]
native-tokio = ["finstack-ai-runtime/native-tokio"]
wasm-host = ["finstack-ai-runtime/wasm-host"]

[dependencies]
finstack-ai-runtime = { workspace = true, default-features = false }
thiserror = { workspace = true }

[dev-dependencies]
finstack-ai-store-memory = { workspace = true }
finstack-ai-test = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
