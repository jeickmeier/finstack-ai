[package]
name = "finstack-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/finstack-ai"
authors.workspace = true
description = "Public SDK/facade for the finstack-ai agent engine"

[lib]
name = "finstack_ai"
path = "src/lib.rs"

[features]
# Providers and tool extensions are opt-in: a default consumer gets the
# native runtime only, and enables `provider-*`/`tool-*` (or `linked-all`)
# for the HTTP stacks it actually ships.
default = ["native-tokio"]
native-tokio = [
    "finstack-ai-runtime/native-tokio",
    "dep:finstack-ai-remote-child",
]
provider-openai = ["native-tokio", "dep:finstack-ai-provider-openai"]
provider-openrouter = ["native-tokio", "dep:finstack-ai-provider-openrouter"]
provider-anthropic = ["native-tokio", "dep:finstack-ai-provider-anthropic"]
provider-gemini = ["native-tokio", "dep:finstack-ai-provider-gemini"]
provider-ollama = ["native-tokio", "dep:finstack-ai-provider-ollama"]
tool-openrouter-media = ["native-tokio", "dep:finstack-ai-tools-openrouter-media"]
tool-openai-media = ["native-tokio", "dep:finstack-ai-tools-openai-media"]
tool-e2b = ["native-tokio", "dep:finstack-ai-sandbox-e2b"]
# `linked-providers` is the only production path that constructs a journal
# store on the caller's behalf (see `agent::linked::memory_store`), so the
# concrete store dependency belongs here rather than on `native-tokio`. A
# default consumer brings its own store and must not pay for this one.
linked-providers = [
    "provider-openai",
    "provider-openrouter",
    "provider-anthropic",
    "provider-gemini",
    "provider-ollama",
    "dep:finstack-ai-store-memory",
]
linked-tools = ["tool-openrouter-media", "tool-openai-media", "tool-e2b"]
linked-all = ["linked-providers", "linked-tools"]
vendored-tls = [
    "finstack-ai-provider-openai?/vendored-tls",
    "finstack-ai-provider-openrouter?/vendored-tls",
    "finstack-ai-provider-anthropic?/vendored-tls",
    "finstack-ai-provider-gemini?/vendored-tls",
    "finstack-ai-provider-ollama?/vendored-tls",
    "finstack-ai-sandbox-e2b?/vendored-tls",
    "finstack-ai-tools-openrouter-media?/vendored-tls",
    "finstack-ai-tools-openai-media?/vendored-tls",
]
# The linked provider aggregate is intentionally explicit. Native runtime
# users can depend on the facade without compiling every HTTP provider.
wasm-host = ["finstack-ai-runtime/wasm-host"]

[dependencies]
finstack-ai-kernel = { workspace = true }
finstack-ai-runtime = { workspace = true, default-features = false }
finstack-ai-provider-openai = { workspace = true, optional = true }
finstack-ai-provider-openrouter = { workspace = true, optional = true }
finstack-ai-provider-anthropic = { workspace = true, optional = true }
finstack-ai-provider-gemini = { workspace = true, optional = true }
finstack-ai-provider-ollama = { workspace = true, optional = true }
finstack-ai-remote-child = { workspace = true, optional = true }
finstack-ai-sandbox-e2b = { workspace = true, optional = true }
finstack-ai-store-memory = { workspace = true, optional = true }
finstack-ai-tools-openrouter-media = { workspace = true, optional = true }
finstack-ai-tools-openai-media = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
finstack-ai-store-memory = { workspace = true }
finstack-ai-test = { workspace = true }
finstack-ai-tools-calculator = { workspace = true }
finstack-ai-tools-skills = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
