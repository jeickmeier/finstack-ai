[package]
name = "finstack-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/finstack-ai"
authors.workspace = true
description = "Public SDK/facade for the finstack-ai agent engine"

[lib]
name = "finstack_ai"
path = "src/lib.rs"

[features]
default = ["native-tokio"]
native-tokio = [
    "finstack-ai-runtime/native-tokio",
    "dep:finstack-ai-provider-openai",
    "dep:finstack-ai-provider-anthropic",
    "dep:finstack-ai-provider-ollama",
    "dep:finstack-ai-provider-gateway",
    "dep:finstack-ai-remote-child",
    "dep:finstack-ai-sandbox-e2b",
    "dep:finstack-ai-store-memory",
]
wasm-host = ["finstack-ai-runtime/wasm-host"]

[dependencies]
finstack-ai-kernel = { workspace = true }
finstack-ai-runtime = { workspace = true, default-features = false }
finstack-ai-provider-openai = { workspace = true, optional = true, features = ["vendored-tls"] }
finstack-ai-provider-anthropic = { workspace = true, optional = true, features = ["vendored-tls"] }
finstack-ai-provider-ollama = { workspace = true, optional = true, features = ["vendored-tls"] }
finstack-ai-provider-gateway = { workspace = true, optional = true, features = ["vendored-tls"] }
finstack-ai-remote-child = { workspace = true, optional = true }
finstack-ai-sandbox-e2b = { workspace = true, optional = true, features = ["vendored-tls"] }
finstack-ai-store-memory = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
finstack-ai-store-memory = { workspace = true }
finstack-ai-test = { workspace = true }
finstack-ai-tools-calculator = { workspace = true }
finstack-ai-tools-skills = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
