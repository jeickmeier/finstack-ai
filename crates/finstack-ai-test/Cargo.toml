[package]
name = "finstack-ai-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/finstack-ai-test"
authors.workspace = true
description = "Scripted models, fakes, and conformance utilities for finstack-ai"
publish = false

[dependencies]
finstack-ai-kernel = { workspace = true }
finstack-ai-protocol = { workspace = true }
finstack-ai-runtime = { workspace = true, default-features = false }
futures-core = { workspace = true }
jsonschema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
finstack-ai = { workspace = true, default-features = false, features = ["native-tokio"] }
finstack-ai-context-memory = { workspace = true }
finstack-ai-middleware-document-ingest = { workspace = true }
finstack-ai-runtime = { workspace = true, default-features = false, features = ["native-tokio"] }
finstack-ai-store-memory = { workspace = true }
finstack-ai-store-sqlite = { workspace = true }
finstack-ai-tools-document = { workspace = true }
finstack-ai-tools-subagent = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }

[[bin]]
name = "generate-journal-fixtures"
path = "src/bin/generate_journal_fixtures.rs"

[[bench]]
name = "conformance"
harness = false

[[bench]]
name = "native_runtime"
harness = false

[[bench]]
name = "growth"
harness = false

[lints]
workspace = true
