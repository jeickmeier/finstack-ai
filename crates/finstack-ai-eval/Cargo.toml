[package]
name = "finstack-ai-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Journal-backed agent evaluation, scoring, and experiment reports"

[features]
default = []
native-tokio = ["finstack-ai/native-tokio", "dep:tokio"]
sqlite = ["dep:rusqlite"]

[dependencies]
finstack-ai = { workspace = true }
finstack-ai-kernel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
finstack-ai-test = { workspace = true }
finstack-ai-store-memory = { workspace = true }
finstack-ai-store-sqlite = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
