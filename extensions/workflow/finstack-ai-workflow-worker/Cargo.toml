[package]
name = "finstack-ai-workflow-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Leased worker daemon for the finstack-ai local workflow driver"
readme = "README.md"

[features]
# Library consumers (notably finstack-ai-workflow-hitl) use the worker
# through its own sqlite adapter and must not compile
# finstack-ai-store-sqlite to get it. The stock daemon binary is the only
# target that binds a concrete journal store.
default = []
daemon = ["dep:finstack-ai-store-sqlite"]

[dependencies]
finstack-ai-kernel = { workspace = true }
finstack-ai-runtime = { workspace = true, default-features = false, features = ["native-tokio"] }
finstack-ai-store-sqlite = { workspace = true, optional = true }
finstack-ai-workflow-local = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "signal", "sync", "time"] }

[dev-dependencies]
finstack-ai-store-memory = { workspace = true }
finstack-ai-test = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "signal", "sync", "time"] }

[[bin]]
name = "finstack_workflow_worker"
path = "src/bin/finstack_workflow_worker.rs"
required-features = ["daemon"]

[lints]
workspace = true
