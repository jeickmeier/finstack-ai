[package]
name = "finstack-ai-tools-openai-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Native OpenAI media-generation toolset for finstack-ai"

[features]
default = []
vendored-tls = ["reqwest/native-tls-vendored"]

[dependencies]
base64 = { workspace = true }
finstack-ai-kernel = { workspace = true }
finstack-ai-net-guard = { workspace = true }
finstack-ai-runtime = { workspace = true, default-features = false, features = ["native-tokio"] }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync"] }

[lints]
workspace = true
