[package]
name = "finstack-ai-store-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Durable local SQLite journal store for finstack-ai"
publish = false

[features]
# Test-only fault hooks on `SqliteJournalStore` (page-count caps, rollback
# journal, padding blobs, append-then-rollback) and the process-kill helper
# binary. Off by default; nothing in the product surface depends on it.
fault-injection = []

[dependencies]
finstack-ai-kernel = { workspace = true }
finstack-ai-protocol = { workspace = true }
finstack-ai-runtime = { workspace = true }
finstack-ai-store-common = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
finstack-ai-test = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[[bench]]
name = "restore_growth"
harness = false

[[bin]]
name = "sqlite_fault_helper"
path = "src/bin/sqlite_fault_helper.rs"
required-features = ["fault-injection"]

[[bin]]
name = "sqlite_ops"
path = "src/bin/sqlite_ops.rs"

[lints]
workspace = true
