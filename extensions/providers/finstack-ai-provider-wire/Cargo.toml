[package]
name = "finstack-ai-provider-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Internal wire framing and response assembly for finstack-ai providers"

[features]
default = []
# Tokio/reqwest streaming driver shared by the native provider leaves.
native = ["dep:bytes", "dep:futures-util", "dep:reqwest", "dep:tokio"]
vendored-tls = ["native", "reqwest/native-tls-vendored"]

[dependencies]
bytes = { workspace = true, optional = true }
finstack-ai-kernel = { workspace = true }
finstack-ai-runtime = { workspace = true }
futures-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true
