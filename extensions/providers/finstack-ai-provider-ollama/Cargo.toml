[package]
name = "finstack-ai-provider-ollama"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Native Ollama /api/chat provider for finstack-ai"
readme = "README.md"

[features]
default = []
vendored-tls = ["reqwest/native-tls-vendored"]

[dependencies]
base64 = { workspace = true }
finstack-ai-kernel = { workspace = true }
finstack-ai-runtime = { workspace = true, default-features = false, features = ["native-tokio"] }
finstack-ai-provider-wire = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
finstack-ai-test = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread"] }

[lints]
workspace = true
