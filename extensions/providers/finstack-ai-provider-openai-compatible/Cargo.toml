[package]
name = "finstack-ai-provider-openai-compatible"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "OpenAI-compatible Chat Completions provider for finstack-ai"
readme = "README.md"

[features]
default = []
vendored-tls = ["reqwest/native-tls-vendored"]

[dependencies]
finstack-ai-runtime = { workspace = true, default-features = false, features = ["native-tokio"] }
futures-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
finstack-ai-kernel = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread"] }

[[bench]]
name = "request_overhead"
harness = false

[lints]
workspace = true
