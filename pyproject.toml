# Virtual uv workspace root (not an installable package).
# Bare `uv build` at the repository root is unsupported; build the member instead:
#   uv build --package finstack-ai
#   uv build --project bindings/finstack-ai-python

[tool.uv]
package = false

[tool.uv.workspace]
members = ["bindings/finstack-ai-python"]

[tool.pytest.ini_options]
pythonpath = ["bindings/finstack-ai-python/python"]
python_classes = ["*Tests", "Test*"]
testpaths = ["bindings/finstack-ai-python/tests"]

[tool.coverage.run]
branch = true
source = ["bindings/finstack-ai-python/python/finstack_ai"]
omit = ["*/tests/*"]

[tool.coverage.report]
skip_empty = true
