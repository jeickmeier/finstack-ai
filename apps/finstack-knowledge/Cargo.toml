[package]
name = "finstack-ai-knowledge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Knowledge agent: ingest, remember, and answer with citations"
publish = false

[dependencies]
finstack-ai = { workspace = true, features = ["native-tokio"] }
finstack-ai-kernel = { workspace = true }
finstack-ai-store-sqlite = { workspace = true }
finstack-ai-context-repository = { workspace = true }
finstack-ai-memory = { workspace = true, features = ["sqlite"] }
finstack-ai-middleware-instructions = { workspace = true }
finstack-ai-middleware-document-ingest = { workspace = true }
finstack-ai-middleware-compaction = { workspace = true }
finstack-ai-tools-document = { workspace = true }
finstack-ai-tools-fetch = { workspace = true }
finstack-ai-tools-skills = { workspace = true }
finstack-ai-observer-log = { workspace = true }
finstack-ai-provider-ollama = { workspace = true }
finstack-ai-provider-anthropic = { workspace = true }
finstack-ai-provider-openai = { workspace = true }
finstack-ai-provider-openrouter = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
rich_rust = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }

[[bin]]
name = "finstack-know"
path = "src/bin/finstack_know.rs"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
