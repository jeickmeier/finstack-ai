# PR-path wheel and source-distribution matrix (trimmed for PR latency).
# Full CPython 3.11–3.14/3.14t coverage remains an ADR-018 launch obligation
# and runs on the Sunday schedule plus workflow_dispatch (python_matrix=full).
# Pull requests and branch pushes keep the mise-pinned CPython 3.14 interpreter.
# Owner: me@jeickmeier.com
# Cadence: every pull request, pushes to main / codex/pr-*, Sundays 06:17 UTC,
# and workflow_dispatch.

name: python-wheels

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/pr-*"
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      python_matrix:
        description: Interpreter matrix (pinned CPython 3.14 or full ADR-018 set)
        type: choice
        default: pinned
        options:
          - pinned
          - full

permissions:
  contents: read

concurrency:
  group: python-wheels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python-matrix:
    name: resolve-python-matrix
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.resolve.outputs.python }}
    steps:
      - name: Resolve interpreter matrix
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.python_matrix }}" = "full" ]; then
            echo 'python=["3.11","3.12","3.13","3.14","3.14t"]' >> "${GITHUB_OUTPUT}"
          else
            echo 'python=["3.14"]' >> "${GITHUB_OUTPUT}"
          fi

  wheels:
    name: wheel (${{ matrix.platform.name }} / CPython ${{ matrix.python }})
    needs: python-matrix
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: manylinux-x86_64
            runner: ubuntu-24.04
            target: x86_64
          - name: manylinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
          - name: macos-arm64
            runner: macos-15
            target: aarch64
          - name: windows-x64
            runner: windows-2025
            target: x64
        python: ${{ fromJSON(needs.python-matrix.outputs.python) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true
          install_args: rust python uv
          cache: true

      - name: Cache Rust build artifacts
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: python-wheel-${{ matrix.platform.name }}

      - name: Build manylinux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.platform.target }}
          args: >-
            --profile release-ci --locked --out dist
            --interpreter python${{ matrix.python }}
            --manifest-path bindings/finstack-ai-python/Cargo.toml
          manylinux: 2_28
          before-script-linux: dnf install -y perl-IPC-Cmd perl-Time-Piece
          sccache: true

      - name: Build native wheel
        if: runner.os == 'macOS'
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          PYTHON_DIST_DIR: dist
        run: mise run build-python-wheel-ci

      - name: Build native Windows wheel
        if: runner.os == 'Windows'
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          PYTHON_DIST_DIR: dist
        run: mise run build-python-wheel-windows-ci

      - name: Install and smoke wheel
        env:
          FINSTACK_EXPECT_FREE_THREADED: ${{ matrix.python == '3.14t' && '1' || '0' }}
          PYTHON_VERSION: ${{ matrix.python }}
          PYTHON_DIST_DIR: dist
        run: mise run smoke-python-wheel-ci

      - name: Upload staged wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finstack-ai-${{ matrix.platform.name }}-cp${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  sdist:
    name: source distribution
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true
          install_args: rust python uv
          cache: true

      - name: Build source distribution
        run: mise run build-python-sdist-ci

      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finstack-ai-sdist
          path: target/python-sdist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
