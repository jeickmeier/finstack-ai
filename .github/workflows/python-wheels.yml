# Required PR-027 wheel and source-distribution workflow.
# PR-032 through PR-038 use the user-authorized one-wheel envelope.
# Full-matrix restoration and execution are explicitly user-owned.
# Hosted PR wheels use Cargo profile `release-ci` (thin LTO); reproducible
# staging (`mise run stage-python`) keeps `profile.release`.
# Owner: me@jeickmeier.com
# Cadence: every pull request, pushes to main / codex/pr-*, and workflow_dispatch.

name: python-wheels

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/pr-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-wheels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  wheels:
    name: wheel (manylinux-x86_64 / CPython 3.14)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true
          install_args: rust python uv
          cache: true

      - name: Build manylinux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.14.1
          target: x86_64
          args: >-
            --profile release-ci --locked --out dist
            --interpreter python3.14
            --manifest-path bindings/finstack-ai-python/Cargo.toml
          manylinux: 2_28
          before-script-linux: dnf install -y perl-IPC-Cmd perl-Time-Piece
          sccache: false

      - name: Install and smoke wheel
        env:
          FINSTACK_EXPECT_FREE_THREADED: "0"
          PYTHON_VERSION: "3.14"
          PYTHON_DIST_DIR: dist
        run: mise run smoke-python-wheel-ci

      - name: Upload staged wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finstack-ai-manylinux-x86_64-cp3.14
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  sdist:
    name: source distribution
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true
          install_args: rust python uv
          cache: true

      - name: Build source distribution
        run: mise run build-python-sdist-ci

      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finstack-ai-sdist
          path: target/python-sdist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
