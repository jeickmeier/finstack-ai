# Non-blocking Criterion benchmark collection for PR-005.
# Owner: me@jeickmeier.com
# Cadence: weekly schedule and workflow_dispatch only.
# Does not gate pull-request merge (PR-003 reservation; PR-005 activation).
# PR-032 through PR-038 use the user-authorized Linux-only envelope.
# Cross-platform restoration and execution are explicitly user-owned.

name: benchmark

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  criterion:
    name: criterion (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true
          install_args: rust python uv
          cache: true

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Benchmark (non-blocking)
        run: mise run benchmark

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ matrix.os }}
          path: |
            target/benchmark/**
          if-no-files-found: error
          retention-days: 30
