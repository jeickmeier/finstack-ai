# PR-032 staged-only Python alpha candidate.
# This workflow has no registry credential and cannot publish to PyPI.

name: python-release-stage

on:
  push:
    branches:
      - main
      - "codex/pr-*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: python-release-stage-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  stage:
    name: reproducible artifacts, SBOM, and signed attestations
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true
          cache: true

      - name: Stage reproducible release candidate
        run: mise run stage-python-release

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            target/python-release/*.whl
            target/python-release/*.tar.gz

      - name: Attest CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            target/python-release/*.whl
            target/python-release/*.tar.gz
          sbom-path: target/python-release/finstack-ai-python.cdx.json

      - name: Upload staged candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finstack-ai-python-0.0.2-alpha-candidate
          path: target/python-release/
          if-no-files-found: error
          retention-days: 30
