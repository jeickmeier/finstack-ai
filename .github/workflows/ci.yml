# Required CI.
# Owner: me@jeickmeier.com
# Cadence: every pull request, pushes to main, and workflow_dispatch.

name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

defaults:
  run:
    shell: bash

jobs:
  ci-rust:
    name: ci-rust
    runs-on: ubuntu-24.04
    # Backs finstack-ai-store-postgres's server-gated test battery
    # (FINSTACK_PG_TEST_URL below). Image pinned by digest (postgres:16).
    services:
      postgres:
        image: postgres@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5 # postgres:16
        env:
          # Loopback-only container discarded with the job. Trust auth avoids
          # committing a database credential in this workflow.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free runner disk
        run: bash scripts/ci/free_github_runner_disk.sh

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true
          cache: true

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Export Python interpreter for PyO3
        run: echo "PYO3_PYTHON=$(uv python find 3.14)" >> "${GITHUB_ENV}"

      - name: Rust CI
        env:
          FINSTACK_PG_TEST_URL: postgres://postgres@localhost:5432/postgres
        run: mise run ci-rust

  ci-python:
    name: ci-python
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true
          cache: true

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Export Python interpreter for PyO3
        run: echo "PYO3_PYTHON=$(uv python find 3.14)" >> "${GITHUB_ENV}"

      - name: Python CI
        run: mise run ci-python

  ci-wasm:
    name: ci-wasm
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch pull-request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true
          cache: true

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.55.1-${{ runner.os }}

      - name: WASM CI
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: mise run ci-wasm
        # Consecutive Linux rebuilds must be byte-identical when glue paths
        # change (`scripts/ci/lib.sh`). Dirty-tree vs the committed Darwin glue
        # is a same-host `check.py dirty` obligation; rustc/wasm-bindgen
        # output is not cross-OS identical. Playwright OS packages are not in
        # the browser cache; `ensure_playwright_browsers` still runs
        # `install-deps` on Linux when `CI=true`.

  ci-native-platforms:
    name: ci-native-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true
          cache: true

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Native confinement checks
        run: mise run check-native-platform

  coverage-rust:
    name: coverage-rust
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    services:
      postgres:
        image: postgres@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5 # postgres:16
        env:
          # Loopback-only container discarded with the job. Trust auth avoids
          # committing a database credential in this workflow.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free runner disk
        run: bash scripts/ci/free_github_runner_disk.sh

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true
          cache: true

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Export Python interpreter for PyO3
        run: echo "PYO3_PYTHON=$(uv python find 3.14)" >> "${GITHUB_ENV}"

      - name: Rust coverage
        env:
          FINSTACK_PG_TEST_URL: postgres://postgres@localhost:5432/postgres
        run: mise run coverage-rust

      - name: Upload Rust coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-rust
          path: target/coverage/rust/lcov.info
          if-no-files-found: error

  coverage-wasm:
    name: coverage-wasm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true
          cache: true

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: WASM coverage
        run: mise run coverage-wasm

      - name: Upload WASM coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-wasm
          path: target/coverage/wasm/lcov.info
          if-no-files-found: error

  ci:
    name: ci
    if: ${{ always() && !cancelled() }}
    needs: [ci-rust, ci-python, ci-wasm, ci-native-platforms, coverage-rust, coverage-wasm]
    runs-on: ubuntu-24.04
    steps:
      - name: Require CI jobs
        run: |
          set -euo pipefail
          if [ "${{ needs.ci-rust.result }}" != "success" ] \
            || [ "${{ needs.ci-python.result }}" != "success" ] \
            || [ "${{ needs.ci-wasm.result }}" != "success" ] \
            || [ "${{ needs.ci-native-platforms.result }}" != "success" ] \
            || [ "${{ needs.coverage-rust.result }}" != "success" ] \
            || [ "${{ needs.coverage-wasm.result }}" != "success" ]; then
            echo "ci-rust=${{ needs.ci-rust.result }} ci-python=${{ needs.ci-python.result }} ci-wasm=${{ needs.ci-wasm.result }} ci-native-platforms=${{ needs.ci-native-platforms.result }} coverage-rust=${{ needs.coverage-rust.result }} coverage-wasm=${{ needs.coverage-wasm.result }}"
            exit 1
          fi

  sonarqube:
    name: SonarQube
    needs: [coverage-rust, coverage-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Download coverage reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/coverage/rust target/coverage/wasm
          gh run download "${GITHUB_RUN_ID}" --name coverage-rust --dir target/coverage/rust
          gh run download "${GITHUB_RUN_ID}" --name coverage-wasm --dir target/coverage/wasm
          rust_lcov="$(find target/coverage/rust -name lcov.info -type f)"
          wasm_lcov="$(find target/coverage/wasm -name lcov.info -type f)"
          test -f "${rust_lcov}"
          test -f "${wasm_lcov}"
          python3 scripts/ci/merge_lcov.py \
            --output target/coverage/lcov.info \
            "${rust_lcov}" \
            "${wasm_lcov}"
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}