# Required cross-platform CI for PR-003.
# Owner: me@jeickmeier.com
# Cadence: every pull request, pushes to main, and workflow_dispatch.
# Path filters: none for required checks (PR-003-A01).

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  workflow-lint:
    name: workflow-lint (actionlint)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.3.10
          install: true
          cache: true

      - name: Lint workflows
        run: mise run lint-workflows

  rust-matrix:
    name: rust (${{ matrix.os }} / ${{ matrix.channel }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        channel: [stable, msrv]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.3.10
          install: true
          cache: true

      - name: Doctor
        run: mise run doctor

      - name: Format
        run: mise run format

      - name: Clippy
        run: mise run clippy

      - name: Test
        run: mise run test

      - name: Docs
        run: mise run docs

      - name: Minimal features
        run: mise run check-minimal

      - name: Architecture
        run: mise run architecture

      - name: WASM target
        run: mise run check-wasm

      - name: CI helper tests
        run: |
          mise run lint-ci
          mise run format-ci
          mise run test-ci

      - name: Python package smoke
        run: mise run build-python

  release-smoke:
    name: release-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.3.10
          install: true
          cache: true

      - name: Release smoke
        run: mise run release-smoke

      - name: Linux reproducibility
        if: runner.os == 'Linux'
        run: mise run release-reproducible

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-${{ matrix.os }}
          path: |
            target/ci-release/**
          if-no-files-found: error
          retention-days: 30
