# Stage signed @finstack/ai 2.0.0 canary artifacts. Does not publish.
# Owner: me@jeickmeier.com

name: npm-release-staging

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    name: stage-npm-canary
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true
          cache: true

      - name: Generate wasm package
        env:
          SOURCE_DATE_EPOCH: "0"
        run: mise run build-wasm -- release

      - name: Stage npm pack artifacts
        run: uv run --no-project python scripts/wasm_package/stage.py

      - name: Upload staged npm artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-staging
          path: dist/npm-staging
          if-no-files-found: error
