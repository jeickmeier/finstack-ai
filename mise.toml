[tools]
rust = { version = "1.97.1", profile = "minimal", components = "rustfmt,clippy" }
python = "3.14"
uv = "0.10.11"

# Prefer bash so multiline tasks stay portable on Windows CI runners.
# Requires mise >= ~2026.7 (`task_config.shell`); workflows pin 2026.8.3.
[task_config]
shell = "bash -c"

[tasks.format]
description = "Format Rust and Python sources in place"
run = """
set -euo pipefail
cargo fmt --all
uv run --no-project --with ruff==0.12.11 ruff format .
"""

[tasks.check]
description = "Check Rust and Python formatting, lints, and types"
run = """
set -euo pipefail
cargo fmt --all --check
cargo clippy --workspace --all-targets --locked -- -D warnings
uv run --no-project --with ruff==0.12.11 ruff format --check .
uv run --no-project --with ruff==0.12.11 ruff check .
uv run --isolated --no-project --with mypy==2.3.0 \
  mypy --strict bindings/finstack-ai-python/python
"""

[tasks.test]
description = "Run Rust workspace tests and Python tests"
run = """
set -euo pipefail
cargo test --workspace --locked
uv run --no-cache --isolated --no-project \
  --with-editable bindings/finstack-ai-python \
  --with pytest==9.1.1 \
  --with pydantic==2.12.5 \
  pytest -q
"""

[tasks.ci]
description = "Run every required check"
run = """
set -euo pipefail
mise run check
mise run test
"""
