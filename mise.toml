[tools]
rust = { version = "1.97.1", profile = "minimal", components = "rustfmt,clippy,llvm-tools", targets = "wasm32-unknown-unknown" }
python = "3.14"
uv = "0.10.11"
node = "22.18.0"
"cargo:wasm-bindgen-cli" = "0.2.127"
"cargo:cargo-fuzz" = "0.13.2"
"github:EmbarkStudios/cargo-deny" = "0.20.2"
"github:taiki-e/cargo-llvm-cov" = { version = "0.8.7", version_prefix = "v" }

# Prefer bash so multiline tasks stay portable on Windows CI runners.
# Requires mise >= ~2026.7 (`task_config.shell`); workflows pin 2026.8.3.
[task_config]
shell = "bash -c"

[tasks.install-all]
description = "Install pinned tools and language environments for Rust, Python, and WASM"
run = """
set -euo pipefail
mise install
cargo fetch --locked
uv python install 3.14
uv sync
npm --prefix bindings/finstack-ai-wasm/js ci
npx --prefix bindings/finstack-ai-wasm/js playwright install --with-deps chromium firefox webkit
"""

[tasks.ci-all]
description = "Run the same required checks as .github/workflows/ci.yml"
run = """
set -euo pipefail
mise run check-rust
mise run check-python
uv run --no-project python tools/perf/check_size_budgets.py
mise run test-rust
mise run test-python
cargo check -p finstack-ai-kernel --target wasm32-unknown-unknown --locked
cargo check -p finstack-ai-runtime --target wasm32-unknown-unknown --locked --features wasm-host
cargo check -p finstack-ai --target wasm32-unknown-unknown --locked --no-default-features --features wasm-host
cargo check -p finstack-ai-wasm --target wasm32-unknown-unknown --locked
cargo check -p finstack-ai-wasm --target wasm32-unknown-unknown --locked --features scripted-trace
cargo check -p finstack-ai-model-port-leaf-fixture --target wasm32-unknown-unknown --locked
cargo check -p finstack-ai-toolset-port-leaf-fixture --target wasm32-unknown-unknown --locked
cargo check -p finstack-ai-extension-port-leaf-fixture --target wasm32-unknown-unknown --locked
uv run --no-project python tools/wasm_package/check.py graph
uv run --no-project python tools/wasm_package/check.py secrets
echo "controls: Engineering Standards §9; Threat Model TM-18; Threat Model §§12-13"
"$(mise where github:EmbarkStudios/cargo-deny)/cargo-deny" check
"$(mise where github:EmbarkStudios/cargo-deny)/cargo-deny" --manifest-path fuzz/Cargo.toml check
FINSTACK_WASM_REPRO="${FINSTACK_WASM_REPRO:-1}" mise run build-wasm -- release
mise run test-wasm
"""

[tasks.build-all]
description = "Build Rust, Python, and WASM bindings"
run = """
set -euo pipefail
mise run build-rust -- "$@"
mise run build-python -- "$@"
mise run build-wasm -- "$@"
"""

[tasks.build-rust]
description = "Build the Rust workspace. Optional profile after -- (default: dev)"
run = """
set -euo pipefail
export PYO3_PYTHON="${PYO3_PYTHON:-$(uv python find 3.14)}"
case "${1:-dev}" in
  release|--release) profile=release ;;
  dev|--dev) profile=dev ;;
  test|--test) profile=test ;;
  *) profile="${1#--}" ;;
esac
cargo build --workspace --locked --profile "${profile}"
"""

[tasks.build-python]
description = "Build the Python bindings. Optional profile after -- (default: dev)"
run = """
set -euo pipefail
export PYO3_PYTHON="${PYO3_PYTHON:-$(uv python find 3.14)}"
case "${1:-dev}" in
  release|--release)
    uv run --no-project --with maturin==1.14.1 \
      maturin build --locked --release --manifest-path bindings/finstack-ai-python/Cargo.toml
    ;;
  dev|--dev)
    uv run --no-project --with maturin==1.14.1 \
      maturin build --locked --manifest-path bindings/finstack-ai-python/Cargo.toml
    ;;
  *)
    uv run --no-project --with maturin==1.14.1 \
      maturin build --locked --profile "${1#--}" --manifest-path bindings/finstack-ai-python/Cargo.toml
    ;;
esac
"""

[tasks.build-wasm]
description = "Build WASM bindings and the JS package. Optional profile after -- (default: dev)"
run = """
set -euo pipefail
export SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-0}"
case "${1:-dev}" in
  release|--release) profile=release; out_dir=release ;;
  dev|--dev) profile=dev; out_dir=debug ;;
  test|--test) profile=test; out_dir=debug ;;
  *) profile="${1#--}"; out_dir="${profile}" ;;
esac
build_glue() {
  cargo build -p finstack-ai-wasm --target wasm32-unknown-unknown --locked --profile "${profile}" --features scripted-trace
  mkdir -p bindings/finstack-ai-wasm/js/generated
  wasm-bindgen \\
    --target web \\
    --out-dir bindings/finstack-ai-wasm/js/generated \\
    --out-name finstack_ai_wasm \\
    "target/wasm32-unknown-unknown/${out_dir}/finstack_ai_wasm.wasm"
}
build_glue
if [ "${FINSTACK_WASM_REPRO:-0}" = "1" ]; then
  snapshot="$(mktemp)"
  uv run --no-project python tools/wasm_package/check.py snapshot "${snapshot}"
  build_glue
  uv run --no-project python tools/wasm_package/check.py compare "${snapshot}"
  rm -f "${snapshot}"
fi
if [ ! -d bindings/finstack-ai-wasm/js/node_modules ]; then
  npm --prefix bindings/finstack-ai-wasm/js ci
fi
npm --prefix bindings/finstack-ai-wasm/js run build
"""

[tasks.check-all]
description = "Format-check and lint Rust, Python, and WASM"
run = """
set -euo pipefail
mise run check-rust
mise run check-python
mise run check-wasm
"""

[tasks.check-rust]
description = "Format-check and lint Rust"
run = """
set -euo pipefail
cargo fmt --all --check
cargo clippy --workspace --all-targets --locked -- -D warnings
cargo clippy -p finstack-ai-wasm --all-targets --locked --features scripted-trace -- -D warnings
"""

[tasks.check-python]
description = "Format-check, lint, and typecheck Python"
run = """
set -euo pipefail
uv run --no-project --with ruff==0.12.11 ruff format --check .
uv run --no-project --with ruff==0.12.11 ruff check .
uv run --isolated --no-project --with mypy==2.3.0 \
  mypy --strict bindings/finstack-ai-python/python
"""

[tasks.check-wasm]
description = "Format-check, lint, and typecheck WASM / TypeScript"
run = """
set -euo pipefail
cargo fmt -p finstack-ai-wasm -- --check
cargo clippy -p finstack-ai-wasm --all-targets --locked -- -D warnings
cargo clippy -p finstack-ai-wasm --all-targets --locked --features scripted-trace -- -D warnings
cargo check -p finstack-ai-wasm --target wasm32-unknown-unknown --locked
cargo check -p finstack-ai-wasm --target wasm32-unknown-unknown --locked --features scripted-trace
if [ ! -d bindings/finstack-ai-wasm/js/node_modules ]; then
  npm --prefix bindings/finstack-ai-wasm/js ci
fi
npm --prefix bindings/finstack-ai-wasm/js run typecheck
"""

[tasks.test-all]
description = "Run Rust, Python, and WASM tests"
run = """
set -euo pipefail
mise run test-rust
mise run test-python
mise run test-wasm
"""

[tasks.test-rust]
description = "Run Rust workspace tests"
run = """
set -euo pipefail
cargo test --workspace --locked
"""

[tasks.test-python]
description = "Run Python binding tests"
run = """
set -euo pipefail
export PYO3_PYTHON="${PYO3_PYTHON:-$(uv python find 3.14)}"
uv run --no-cache --isolated --no-project \
  --with-editable bindings/finstack-ai-python \
  --with pytest==9.1.1 \
  --with pydantic==2.12.5 \
  pytest -q
"""

[tasks.test-wasm]
description = "Type-check and run the headless Chromium, Firefox, and WebKit WASM harness"
run = """
set -euo pipefail
mise run build-wasm -- release
uv run --no-project python tools/wasm_package/check.py generated
if [ ! -d bindings/finstack-ai-wasm/js/node_modules ]; then
  npm --prefix bindings/finstack-ai-wasm/js ci
fi
npm --prefix bindings/finstack-ai-wasm/js run typecheck
npx --prefix bindings/finstack-ai-wasm/js playwright install --with-deps chromium firefox webkit
npm --prefix bindings/finstack-ai-wasm/js test
uv run --no-project python tools/wasm_package/check.py size
"""

[tasks.coverage-all]
description = "Write diagnostic Rust, Python, and WASM coverage reports"
run = """
set -euo pipefail
mise run coverage-rust
mise run coverage-python
mise run coverage-wasm
"""

[tasks.coverage-rust]
description = "Write diagnostic Rust workspace coverage (HTML + LCOV)"
run = """
set -euo pipefail
export PATH="$(mise where github:taiki-e/cargo-llvm-cov):${PATH}"
mkdir -p target/coverage/rust
cargo llvm-cov clean --workspace
cargo llvm-cov --workspace --locked --html \
  --output-dir target/coverage/rust/html
cargo llvm-cov report --lcov --output-path target/coverage/rust/lcov.info
"""

[tasks.coverage-python]
description = "Write diagnostic Python binding coverage (HTML + XML)"
run = """
set -euo pipefail
export PYO3_PYTHON="${PYO3_PYTHON:-$(uv python find 3.14)}"
mkdir -p target/coverage/python
uv run --no-cache --isolated --no-project \
  --with-editable bindings/finstack-ai-python \
  --with pytest==9.1.1 \
  --with pytest-cov==7.1.0 \
  --with pydantic==2.12.5 \
  pytest -q \
    --cov \
    --cov-report=term \
    --cov-report=html:target/coverage/python/html \
    --cov-report=xml:target/coverage/python/coverage.xml
"""

[tasks.coverage-wasm]
description = "Write the pending WASM coverage scaffold artifact"
run = """
set -euo pipefail
mkdir -p target/coverage/wasm
cat > target/coverage/wasm/PENDING.md <<'EOF'
# WASM coverage pending

Real WASM coverage waits on a `wasm-bindgen-test` (or equivalent) suite
for `finstack-ai-wasm` and kernel-on-wasm execution.

`mise run check-wasm` remains the compile gate.
`mise run test-wasm` remains the package harness.
EOF
"""

[tasks.bench-all]
description = "Run Rust, Python, and WASM benchmarks"
run = """
set -euo pipefail
mise run bench-rust
mise run bench-python
mise run bench-wasm
"""

[tasks.bench-rust]
description = "Run Criterion groups plus native idle-session allocation/RSS profiles"
run = """
set -euo pipefail
CONFORMANCE='kernel_micro|resolved_dispatch|scripted_model_reducer|state_scaling'
GROWTH='session_append_scaling|tool_settlement_width'
SQLITE='sqlite_scan_paging|sqlite_concurrent|sqlite_restore|sqlite_recover'
cargo bench -p finstack-ai-test --offline --locked --bench conformance -- "${CONFORMANCE}"
cargo bench -p finstack-ai-test --offline --locked --bench growth -- "${GROWTH}"
cargo bench -p finstack-ai-store-sqlite --offline --locked --bench restore_growth -- "${SQLITE}"
cargo bench -p finstack-ai-test --offline --locked --bench native_runtime -- --mode idle --sessions 128
"""

[tasks.bench-python]
description = "Measure the Rust-backed Python fast-path fixture"
run = """
set -euo pipefail
export PYO3_PYTHON="${PYO3_PYTHON:-$(uv python find 3.14)}"
uv run --no-project --with maturin==1.14.1 \
  maturin develop --locked --manifest-path bindings/finstack-ai-python/Cargo.toml \
  --features benchmark-fixture,extension-module
uv run --no-project --with pydantic==2.12.5 python tools/perf/python_fast_path.py "$@"
"""

[tasks.bench-wasm]
description = "Record WASM/JS crossing warning measurements"
run = """
set -euo pipefail
mise run build-wasm -- release
cd bindings/finstack-ai-wasm/js
npx playwright install --with-deps chromium
npx playwright test src/benchmark.test.ts --project=chromium
"""
