[tools]
rust = { version = "1.97.1", profile = "minimal", components = "rustfmt,clippy,llvm-tools-preview", targets = "wasm32-unknown-unknown" }
python = "3.14"
uv = "0.10.11"
node = "22.18.0"
"cargo:wasm-bindgen-cli" = "0.2.127"
"cargo:cargo-fuzz" = "0.13.2"
"github:EmbarkStudios/cargo-deny" = "0.20.2"
"github:taiki-e/cargo-llvm-cov" = { version = "0.8.7", version_prefix = "v" }

# Prefer bash so multiline tasks stay portable on Windows CI runners.
# Requires mise >= ~2026.7 (`task_config.shell`); workflows pin 2026.8.3.
[task_config]
shell = "bash -c"

[tasks.format]
description = "Format Rust and Python sources in place"
run = """
set -euo pipefail
cargo fmt --all
uv run --no-project --with ruff==0.12.11 ruff format .
"""

[tasks.check]
description = "Check Rust and Python formatting, lints, and types"
run = """
set -euo pipefail
cargo fmt --all --check
cargo clippy --workspace --all-targets --locked -- -D warnings
cargo clippy -p finstack-ai-wasm --all-targets --locked --features scripted-trace -- -D warnings
uv run --no-project --with ruff==0.12.11 ruff format --check .
uv run --no-project --with ruff==0.12.11 ruff check .
uv run --isolated --no-project --with mypy==2.3.0 \
  mypy --strict bindings/finstack-ai-python/python
mise run check-size-budgets
"""

[tasks.check-size-budgets]
description = "Fail when ratified wheel, WASM, or CLI size budgets are exceeded"
run = """
set -euo pipefail
uv run --no-project python tools/perf/check_size_budgets.py
"""

[tasks.test]
description = "Run Rust workspace tests and Python tests"
run = """
set -euo pipefail
cargo test --workspace --locked
uv run --no-cache --isolated --no-project \
  --with-editable bindings/finstack-ai-python \
  --with pytest==9.1.1 \
  --with pydantic==2.12.5 \
  pytest -q
"""

[tasks.gen-wit]
description = "Regenerate dual-major @0.0.4 and @1.0.0 WIT host and guest bindings"
run = """
set -euo pipefail
uv run --no-project python tools/wit_bindgen/generate.py
"""

[tasks.check-wit]
description = "Fail when generated WIT bindings drift from the checked-in packages"
run = """
set -euo pipefail
uv run --no-project python tools/wit_bindgen/generate.py --check
"""

[tasks.gen-guest-sdk]
description = "Copy canonical @0.0.4 WIT packages into guest-sdk, templates, and references"
run = """
set -euo pipefail
uv run --no-project python tools/plugin_wasm/sync_guest_wit.py
"""

[tasks.check-guest-sdk]
description = "Fail when vendored guest WIT drifts from canonical @0.0.4 packages"
run = """
set -euo pipefail
uv run --no-project python tools/plugin_wasm/sync_guest_wit.py --check
"""

[tasks.migrate]
description = "Convert 0.1.0 journal, AgentSpec, or WIT manifest documents toward 1.0.0"
run = """
set -euo pipefail
uv run --no-project python tools/migrate/migrate.py "$@"
"""

[tasks.check-public-items]
description = "Fail when frozen public Rust/Python/JS items are removed"
run = """
set -euo pipefail
uv run --no-project python tools/compat/public_items.py --check
"""

[tasks.gen-plugin-wasm]
description = "Build and encode test-only plugin guests and published reference components"
run = """
set -euo pipefail
uv run --no-project python tools/plugin_wasm/generate.py
"""

[tasks.check-plugin-wasm]
description = "Fail when checked-in plugin guest or reference components drift"
run = """
set -euo pipefail
uv run --no-project python tools/plugin_wasm/generate.py --check
"""

[tasks.check-plugin-template]
description = "Copy the toolset template, build, encode, and run it through PluginHost"
run = """
set -euo pipefail
uv run --no-project python tools/plugin_wasm/template_check.py
"""

[tasks.gen-plugin-lock]
description = "Write plugins/reference/plugin.lock.json from local component directories"
run = """
set -euo pipefail
uv run --no-project python tools/plugin_lock/lock.py
"""

[tasks.check-plugin-lock]
description = "Fail when the checked-in plugin lockfile drifts"
run = """
set -euo pipefail
uv run --no-project python tools/plugin_lock/lock.py --check
"""

[tasks.check-wasm]
description = "Type-check the wasm-host graph and reject Tokio in browser builds"
run = """
set -euo pipefail
cargo check -p finstack-ai-kernel --target wasm32-unknown-unknown --locked
cargo check -p finstack-ai-runtime --target wasm32-unknown-unknown --locked --features wasm-host
cargo check -p finstack-ai --target wasm32-unknown-unknown --locked --no-default-features --features wasm-host
cargo check -p finstack-ai-wasm --target wasm32-unknown-unknown --locked
cargo check -p finstack-ai-wasm --target wasm32-unknown-unknown --locked --features scripted-trace
cargo check -p finstack-ai-model-port-leaf-fixture --target wasm32-unknown-unknown --locked
cargo check -p finstack-ai-toolset-port-leaf-fixture --target wasm32-unknown-unknown --locked
cargo check -p finstack-ai-extension-port-leaf-fixture --target wasm32-unknown-unknown --locked
uv run --no-project python tools/wasm_package/check.py graph
uv run --no-project python tools/wasm_package/check.py secrets
"""

[tasks.generate-wasm]
description = "Regenerate wasm-bindgen glue and TypeScript declarations"
run = """
set -euo pipefail
export SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-0}"
build_glue() {
  cargo build -p finstack-ai-wasm --target wasm32-unknown-unknown --release --locked --features scripted-trace
  mkdir -p bindings/finstack-ai-wasm/js/generated
  wasm-bindgen \\
    --target web \\
    --out-dir bindings/finstack-ai-wasm/js/generated \\
    --out-name finstack_ai_wasm \\
    target/wasm32-unknown-unknown/release/finstack_ai_wasm.wasm
}
build_glue
if [ "${FINSTACK_WASM_REPRO:-0}" = "1" ]; then
  snapshot="$(mktemp)"
  uv run --no-project python tools/wasm_package/check.py snapshot "${snapshot}"
  build_glue
  uv run --no-project python tools/wasm_package/check.py compare "${snapshot}"
  rm -f "${snapshot}"
fi
if [ ! -d bindings/finstack-ai-wasm/js/node_modules ]; then
  npm --prefix bindings/finstack-ai-wasm/js ci
fi
npm --prefix bindings/finstack-ai-wasm/js run build
"""

[tasks.test-browser]
description = "Type-check and run the headless Chromium, Firefox, and WebKit wasm package harness"
run = """
set -euo pipefail
mise run generate-wasm
uv run --no-project python tools/wasm_package/check.py generated
npm --prefix bindings/finstack-ai-wasm/js run typecheck
npx --prefix bindings/finstack-ai-wasm/js playwright install --with-deps chromium firefox webkit
npm --prefix bindings/finstack-ai-wasm/js test
uv run --no-project python tools/wasm_package/check.py size
"""

[tasks.stage-wasm]
description = "Stage unpublished npm alpha artifacts and typecheck a clean install"
run = """
set -euo pipefail
export SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-0}"
mise run generate-wasm
uv run --no-project python tools/wasm_package/stage.py
"""

[tasks.benchmark-wasm]
description = "Record WASM/JS crossing warning measurements"
run = """
set -euo pipefail
mise run generate-wasm
cd bindings/finstack-ai-wasm/js
npx playwright install --with-deps chromium
npx playwright test src/benchmark.test.ts --project=chromium
"""

[tasks.docs-links]
description = "Check relative markdown links on the public docs set"
run = """
set -euo pipefail
uv run --no-project python tools/docs/links.py
"""

[tasks.docs-quickstarts]
description = "Execute offline public-package quick starts"
run = """
set -euo pipefail
uv run --no-project python tools/docs/quickstarts.py
"""

[tasks.docs-license]
description = "Sweep public package license metadata for MIT OR Apache-2.0"
run = """
set -euo pipefail
uv run --no-project python tools/docs/license_sweep.py
"""

[tasks.conformance]
description = "Run published port and plugin conformance suites"
run = """
set -euo pipefail
cargo test -p finstack-ai-test --locked --lib -- conformance::ports::tests
cargo test -p finstack-ai-test --locked --test port_conformance --test compaction_conformance
cargo test -p finstack-ai-plugin-host --locked -- conformance -- --test-threads=1
"""

[tasks.supply-chain]
description = "Run cargo-deny supply-chain policy (Eng Standards §9; TM-18)"
run = """
set -euo pipefail
echo "controls: Engineering Standards §9; Threat Model TM-18; Threat Model §§12-13"
"$(mise where github:EmbarkStudios/cargo-deny)/cargo-deny" check
"$(mise where github:EmbarkStudios/cargo-deny)/cargo-deny" --manifest-path fuzz/Cargo.toml check
"""

[tasks.recreate-release]
description = "Two-run SHA-256 recreate of unpublished 1.0.0 artifacts"
run = """
set -euo pipefail
uv run --no-project python tools/docs/recreate_release.py
"""

[tasks.release-rehearsal]
description = "Two-run local staging checksum identity (unpublished 1.0.0)"
run = """
set -euo pipefail
mise run recreate-release
"""

[tasks.starter-rc]
description = "Run in-tree starters against staged RC artifacts"
run = """
set -euo pipefail
if [ ! -f bindings/finstack-ai-wasm/js/dist/index.js ]; then
  mise run generate-wasm
fi
uv run --no-project python tools/docs/starter_rc.py
"""

[tasks.hotfix-rehearsal]
description = "Baseline vs patch-line checksum pair (unpublished)"
run = """
set -euo pipefail
uv run --no-project python tools/docs/hotfix_rehearsal.py
"""

[tasks.fuzz-smoke]
description = "Run deterministic bounded smoke campaigns for every cargo-fuzz target"
run = """
set -euo pipefail
rustup toolchain install nightly-2026-08-14 --profile minimal
cd fuzz
for target in record_replay_json kernel_transition_json run_event_json message_json remote_frame wit_input recovery_sequence; do
  cargo +nightly-2026-08-14 fuzz run "${target}" -- \
    -seed=1 \
    -runs=256 \
    -max_total_time=5 \
    -timeout=5 \
    -max_len=1048576 \
    -rss_limit_mb=2048
done
"""

[tasks.fuzz-local]
description = "Bounded local fuzz campaign (not a hosted soak)"
run = """
set -euo pipefail
rustup toolchain install nightly-2026-08-14 --profile minimal
cd fuzz
for target in record_replay_json kernel_transition_json run_event_json message_json remote_frame wit_input recovery_sequence; do
  cargo +nightly-2026-08-14 fuzz run "${target}" -- \
    -seed=1 \
    -max_total_time=30 \
    -timeout=5 \
    -max_len=1048576 \
    -rss_limit_mb=2048
done
"""

[tasks.coverage-rust]
description = "Write diagnostic Rust workspace coverage (HTML + LCOV)"
run = """
set -euo pipefail
export PATH="$(mise where github:taiki-e/cargo-llvm-cov):${PATH}"
mkdir -p target/coverage/rust
cargo llvm-cov clean --workspace
cargo llvm-cov --workspace --locked --html \
  --output-dir target/coverage/rust/html
cargo llvm-cov report --lcov --output-path target/coverage/rust/lcov.info
"""

[tasks.coverage-python]
description = "Write diagnostic Python binding coverage (HTML + XML)"
run = """
set -euo pipefail
mkdir -p target/coverage/python
uv run --no-cache --isolated --no-project \
  --with-editable bindings/finstack-ai-python \
  --with pytest==9.1.1 \
  --with pytest-cov==7.1.0 \
  --with pydantic==2.12.5 \
  pytest -q \
    --cov \
    --cov-report=term \
    --cov-report=html:target/coverage/python/html \
    --cov-report=xml:target/coverage/python/coverage.xml
"""

[tasks.coverage-wasm]
description = "Write the pending WASM coverage scaffold artifact"
run = """
set -euo pipefail
mkdir -p target/coverage/wasm
cat > target/coverage/wasm/PENDING.md <<'EOF'
# WASM coverage pending

Real WASM coverage waits on a `wasm-bindgen-test` (or equivalent) suite
for `finstack-ai-wasm` and kernel-on-wasm execution.

`mise run check-wasm` remains the compile gate.
`mise run test-browser` remains the package harness.
EOF
"""

[tasks.coverage]
description = "Write diagnostic Rust, Python, and WASM coverage reports"
run = """
set -euo pipefail
mise run coverage-rust
mise run coverage-python
mise run coverage-wasm
"""

[tasks.ci]
description = "Run every required check"
run = """
set -euo pipefail
mise run check
mise run test
mise run check-wasm
mise run supply-chain
"""
