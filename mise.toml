[tools]
rust = { version = "1.97.1", profile = "minimal", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
python = "3.14"
uv = "0.10.11"
"github:EmbarkStudios/cargo-deny" = "0.20.2"
"github:taiki-e/cargo-llvm-cov" = { version = "0.8.7", version_prefix = "v" }
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:rhysd/actionlint" = "1.7.12"
"cargo:cargo-fuzz" = "0.13.2"

# Prefer bash so multiline tasks stay portable on Windows CI runners.
# Requires mise >= ~2026.7 (`task_config.shell`); workflows pin 2026.8.3.
[task_config]
shell = "bash -c"

# Install and environment check tasks

[tasks.install]
description = "Install pinned project tools"
run = "mise install"

[tasks.doctor]
description = "Verify pinned toolchain is available"
# Prefer PATH-resolved tools and avoid `/dev/null` redirects so the same
# command works when mise executes tasks via cmd.exe on Windows.
run = """
rustup component add rustfmt clippy llvm-tools-preview
rustup target add wasm32-unknown-unknown
rustc --version
cargo --version
rustfmt --version
cargo clippy --version
cargo fuzz --version
"$(mise where github:taiki-e/cargo-llvm-cov)/cargo-llvm-cov" llvm-cov --version
rustc --print cfg --target wasm32-unknown-unknown
python --version
uv --version
cargo-deny --version
gitleaks version
actionlint --version
"""

# Code checks

[tasks.check]
description = "Type-check the full Cargo workspace"
run = "cargo check --workspace --all-targets --locked"

[tasks.check-kernel]
description = "Type-check the kernel crate only (minimal target)"
run = "cargo check -p finstack-ai-kernel --locked"

[tasks.check-minimal]
description = "Type-check minimal-feature and kernel-only graphs"
run = """
cargo check -p finstack-ai-kernel --locked
cargo check -p finstack-ai-runtime --no-default-features --locked
cargo check -p finstack-ai --no-default-features --locked
cargo check -p finstack-ai-protocol --locked
cargo check -p finstack-ai-test --no-default-features --locked
cargo check -p finstack-ai-extension-port-leaf-fixture --no-default-features --locked
"""

[tasks.check-wasm]
description = "Type-check kernel/runtime tests and browser WASM binding for wasm32"
run = """
rustup target add wasm32-unknown-unknown && \
cargo check -p finstack-ai-kernel --target wasm32-unknown-unknown --locked && \
RUSTFLAGS='--cfg getrandom_backend="unsupported"' \
  cargo test -p finstack-ai-kernel --target wasm32-unknown-unknown --no-run --locked && \
RUSTFLAGS='--cfg getrandom_backend="unsupported"' \
  cargo test -p finstack-ai-runtime --target wasm32-unknown-unknown --no-default-features --features wasm-host --no-run --locked && \
cargo check -p finstack-ai-extension-port-leaf-fixture --target wasm32-unknown-unknown --no-default-features --locked && \
cargo check -p finstack-ai-wasm --target wasm32-unknown-unknown --locked
if cargo tree -p finstack-ai-runtime --target wasm32-unknown-unknown --no-default-features --features wasm-host -e normal | grep -q 'tokio '; then
  echo 'wasm-host unexpectedly resolves Tokio'
  exit 1
fi
"""

# TypeScript formatting deferred until a TypeScript package and formatter config exist.
[tasks.format]
description = "Format Rust and Python sources"
run = """
set -euo pipefail
cargo fmt --all
uv run --no-project --with ruff==0.12.11 ruff format .
"""

[tasks.clippy]
description = "Lint the Cargo workspace with warnings denied"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.test]
description = "Run Cargo workspace tests"
run = "cargo test --workspace --locked"

[tasks.test-kernel]
description = "Run focused kernel/runtime and public-Rust-API tests through PR-016"
run = """
set -euo pipefail
cargo test -p finstack-ai-kernel --locked
cargo test -p finstack-ai-runtime --locked
cargo test -p finstack-ai-test --test public_rust_api --locked
"""

[tasks.test-runtime]
description = "Run runtime, task-owner, ingress, model, lifecycle, timer, and memory-store tests through PR-019"
run = """
set -euo pipefail
cargo test -p finstack-ai-runtime --features native-tokio --locked
cargo test -p finstack-ai-store-memory --locked
cargo test -p finstack-ai-test --test model_port --locked
"""

[tasks.test-events]
description = "Run PR-017 event hub, batching, backpressure, and incremental progress proofs"
run = """
set -euo pipefail
cargo test -p finstack-ai-runtime --features native-tokio event_hub::native::tests --locked
cargo test -p finstack-ai-test --test model_port runtime_publishes_validated_progress_before_terminal_settlement --locked
cargo test -p finstack-ai-test --test tool_port runtime_publishes_tool_progress_before_tool_settlement --locked
"""

[tasks.test-extensions]
description = "Run PR-018 context, middleware, observer, compaction, recovery, and leaf-ABI proofs"
run = """
set -euo pipefail
cargo test -p finstack-ai-runtime --features native-tokio context::tests --locked
cargo test -p finstack-ai-runtime --features native-tokio middleware::tests --locked
cargo test -p finstack-ai-runtime --features native-tokio observer::tests --locked
cargo check -p finstack-ai-extension-port-leaf-fixture --no-default-features --locked
cargo check -p finstack-ai-extension-port-leaf-fixture --target wasm32-unknown-unknown --no-default-features --locked
"""

[tasks.test-lifecycle]
description = "Run PR-019 cancellation-tree, deadline, retry-timer, restart, and shutdown proofs"
run = """
set -euo pipefail
cargo test -p finstack-ai-runtime --features native-tokio model::tests::cancellation_hierarchy --locked
cargo test -p finstack-ai-runtime --features native-tokio time::tests --locked
cargo test -p finstack-ai-runtime --features native-tokio timer_runtime::tests --locked
cargo test -p finstack-ai-runtime --features native-tokio task::tests --locked
cargo test -p finstack-ai-test --test model_port an_expired_committed_deadline_prevents_provider_execution --locked
cargo test -p finstack-ai-test --test model_port runtime_routes_cancel_effect_to_only_the_active_model_task --locked
cargo test -p finstack-ai-test --test model_port persisted_retry_timer_resumes_once_after_runtime_restart --locked
cargo test -p finstack-ai-test --test model_port shutdown_aborts_an_uncooperative_model_only_after_its_grace_deadline --locked
cargo test -p finstack-ai-test --test tool_port cancellation_cleans_running_and_queued_calls_without_starting_the_queue --locked
cargo test -p finstack-ai-test --test tool_port shutdown_cancels_streaming_tool_children_without_leaks --locked
"""

[tasks.test-runtime-gate]
description = "Run PR-020 commit-prefix, bounded scheduling, stress, and leak proofs"
run = """
set -euo pipefail
cargo test -p finstack-ai-runtime --features native-tokio coordinator::tests --locked
cargo test -p finstack-ai-runtime --features native-tokio repeated_idle_owners_join_every_owned_task_without_abort --locked
cargo test -p finstack-ai-runtime --features native-tokio event_hub::native::tests::stalled_observer_does_not_delay_interactive_delivery --locked
cargo test -p finstack-ai-test --test model_port failed_model_request_append_never_executes_the_model --locked
cargo test -p finstack-ai-test --test model_port repeated_model_runs_settle_and_shutdown_without_stream_or_task_leaks --locked
cargo test -p finstack-ai-test --test tool_port shutdown_cancels_streaming_tool_children_without_leaks --locked
"""

[tasks.test-sdk]
description = "Run PR-021 typed registration, factory, lifecycle, resolution, and target checks"
run = """
set -euo pipefail
cargo test -p finstack-ai --locked
cargo clippy -p finstack-ai --all-targets --all-features --locked -- -D warnings
cargo check -p finstack-ai --no-default-features --locked
cargo check -p finstack-ai --target wasm32-unknown-unknown --no-default-features --features wasm-host --locked
"""

[tasks.test-pr022]
description = "Run PR-022 spec, bundle, lock, child, budget, artifact, and decode proofs"
run = """
set -euo pipefail
cargo test -p finstack-ai-kernel --locked
cargo test -p finstack-ai-runtime --all-features --locked
cargo test -p finstack-ai --all-features --locked
cargo clippy -p finstack-ai-kernel -p finstack-ai-runtime -p finstack-ai --all-targets --all-features --locked -- -D warnings
"""

[tasks.test-pr023]
description = "Run PR-023 public test-kit, six-port, golden, and compaction conformance proofs"
run = """
set -euo pipefail
cargo test -p finstack-ai-test --locked
cargo test -p finstack-ai-model-port-leaf-fixture -p finstack-ai-toolset-port-leaf-fixture --locked
cargo test -p finstack-ai --test public_test_kit --locked
cargo clippy -p finstack-ai-test -p finstack-ai-model-port-leaf-fixture -p finstack-ai-toolset-port-leaf-fixture -p finstack-ai --all-targets --locked -- -D warnings
cargo check -p finstack-ai-test --no-default-features --locked
mise run schema-governance
mise run architecture
"""

[tasks.test-pr024]
description = "Run PR-024 OpenAI-compatible provider, isolation, fixture, and benchmark proofs"
run = """
set -euo pipefail
cargo test -p finstack-ai-provider-openai-compatible --locked
cargo clippy -p finstack-ai-provider-openai-compatible --all-targets --locked -- -D warnings
cargo bench -p finstack-ai-provider-openai-compatible --bench request_overhead --no-run --locked
cargo test -p finstack-ai-test --test model_port --locked
cargo check -p finstack-ai-kernel --locked
cargo check -p finstack-ai-runtime --no-default-features --locked
if cargo tree -p finstack-ai-kernel -e normal --locked | grep -Eq 'finstack-ai-provider-openai-compatible|reqwest'; then
  echo 'kernel normal dependency graph unexpectedly includes the native provider or HTTP client'
  exit 1
fi
if cargo tree -p finstack-ai-runtime --no-default-features -e normal --locked | grep -Eq 'finstack-ai-provider-openai-compatible|reqwest'; then
  echo 'runtime normal dependency graph unexpectedly includes the native provider or HTTP client'
  exit 1
fi
mise run architecture
"""

[tasks.test-pr025]
description = "Run PR-025 calculator, scoped filesystem, race, artifact, and benchmark proofs"
run = """
set -euo pipefail
cargo test -p finstack-ai-tools-calculator -p finstack-ai-tools-filesystem --locked
cargo clippy -p finstack-ai-tools-calculator -p finstack-ai-tools-filesystem --all-targets --locked -- -D warnings
cargo bench -p finstack-ai-tools-calculator --bench calculator --no-run --locked
cargo check -p finstack-ai-kernel --locked
cargo check -p finstack-ai-runtime --no-default-features --locked
if cargo tree -p finstack-ai-kernel -e normal --locked | grep -Eq 'finstack-ai-tools-(calculator|filesystem)|rustix'; then
  echo 'kernel normal dependency graph unexpectedly includes a tool battery or filesystem syscall adapter'
  exit 1
fi
if cargo tree -p finstack-ai-runtime --no-default-features -e normal --locked | grep -Eq 'finstack-ai-tools-(calculator|filesystem)|rustix'; then
  echo 'runtime normal dependency graph unexpectedly includes a tool battery or filesystem syscall adapter'
  exit 1
fi
mise run architecture
"""

[tasks.test-pr026]
description = "Run PR-026 native facade and offline developer-preview examples"
run = """
set -euo pipefail
cargo test -p finstack-ai --locked
cargo clippy -p finstack-ai -p finstack-ai-native-examples --all-targets --locked -- -D warnings
cargo run --quiet --manifest-path fixtures/ci/native-user/Cargo.toml --locked
cargo run --quiet -p finstack-ai-native-examples --bin minimal --locked
cargo run --quiet -p finstack-ai-native-examples --bin coding --locked
cargo run --quiet -p finstack-ai-native-examples --bin service --locked
cargo run --quiet -p finstack-ai-native-examples --bin diagnostic --locked
"""

[tasks.preview-performance]
description = "Generate native preview benchmark, memory, binary-size, and warning reports"
run = """
set -euo pipefail
mise run benchmark-smoke
mise run release-smoke
uv run --no-project python tools/preview/check.py
"""

[tasks.preview-stage]
description = "Reproducibly stage the native 0.0.1-dev developer preview"
run = "uv run --no-project python tools/preview/release.py"

[tasks.test-model]
description = "Run PR-015 Model port, scripted stream, and leaf ABI proofs"
run = """
set -euo pipefail
cargo test -p finstack-ai-runtime --features native-tokio model::tests --locked
cargo test -p finstack-ai-test --test model_port --locked
cargo check -p finstack-ai-model-port-leaf-fixture --no-default-features --locked
cargo check -p finstack-ai-model-port-leaf-fixture --no-default-features --target wasm32-unknown-unknown --locked
"""

[tasks.test-tool]
description = "Run PR-016 Toolset validation, scheduler, panic, ordering, and leaf ABI proofs"
run = """
set -euo pipefail
cargo test -p finstack-ai-test --test tool_port --locked
cargo check -p finstack-ai-toolset-port-leaf-fixture --no-default-features --locked
cargo check -p finstack-ai-toolset-port-leaf-fixture --no-default-features --target wasm32-unknown-unknown --locked
cargo test --release -p finstack-ai-test --test tool_port native_panic_becomes_stable_call_failure_without_leaking_payload_or_killing_sibling --locked
"""

[tasks.conformance]
description = "Run reducer traces and public compatibility through PR-016"
run = "cargo test -p finstack-ai-test --locked"

[tasks.test-benchmark]
description = "Run benchmark staging helper unit tests"
run = "uv run --no-project --with pytest==9.1.1 pytest tools/benchmark/tests -v"

[tasks.lint-benchmark]
description = "Lint benchmark helper Python sources"
run = "uv run --no-project --with ruff==0.12.11 ruff check tools/benchmark"

[tasks.format-benchmark]
description = "Check benchmark helper Python formatting"
run = "uv run --no-project --with ruff==0.12.11 ruff format --check tools/benchmark"

[tasks.benchmark-smoke]
description = "Compile Criterion benches and run a short non-blocking smoke with metadata"
run = """
uv run --no-project python tools/benchmark/run.py compile
uv run --no-project python tools/benchmark/run.py smoke
"""

[tasks.benchmark]
description = "Run Criterion benches and stage machine-readable metadata (non-blocking)"
run = "uv run --no-project python tools/benchmark/run.py full"

[tasks.docs]
description = "Build workspace rustdoc with warnings denied"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps --locked"

[tasks.test-architecture]
description = "Run architecture checker unit tests"
run = "uv run --no-project --with pytest==9.1.1 pytest tools/architecture/tests -v"

[tasks.lint-architecture]
description = "Lint architecture checker Python sources"
run = "uv run --no-project --with ruff==0.12.11 ruff check tools/architecture"

[tasks.format-architecture]
description = "Check architecture checker Python formatting"
run = "uv run --no-project --with ruff==0.12.11 ruff format --check tools/architecture"

[tasks.architecture]
description = "Enforce architecture, dependency, and feature boundaries"
run = """
uv run --no-project --with pytest==9.1.1 pytest tools/architecture/tests -q && \
uv run --no-project python tools/architecture/check.py
"""

[tasks.lint-ci]
description = "Lint CI helper Python sources"
run = "uv run --no-project --with ruff==0.12.11 ruff check tools/ci tools/security tools/preview"

[tasks.format-ci]
description = "Check CI helper Python formatting"
run = "uv run --no-project --with ruff==0.12.11 ruff format --check tools/ci tools/security tools/preview"

[tasks.test-ci]
description = "Run CI and security helper unit tests"
run = "uv run --no-project --with pytest==9.1.1 pytest tools/ci/tests tools/security/tests -v"

[tasks.test-schema-governance]
description = "Run ADR/schema governance unit tests"
run = "uv run --no-project --with pytest==9.1.1 pytest tools/schema_governance/tests -v"

[tasks.lint-schema-governance]
description = "Lint schema governance Python sources"
run = "uv run --no-project --with ruff==0.12.11 ruff check tools/schema_governance"

[tasks.format-schema-governance]
description = "Check schema governance Python formatting"
run = "uv run --no-project --with ruff==0.12.11 ruff format --check tools/schema_governance"

[tasks.schema-governance]
description = "Enforce ADR inventory, contract registry, and schema/fixture coupling"
run = "uv run --no-project python tools/schema_governance/check.py"

[tasks.lint-workflows]
description = "Lint GitHub Actions workflow files"
run = "actionlint"

# Diagnostic coverage (no percentage gate; Eng Standards §10.2)

[tasks.coverage-rust]
description = "Generate Rust workspace coverage (HTML + LCOV under target/coverage/rust)"
run = """
set -euo pipefail
rustup component add llvm-tools-preview
mkdir -p target/coverage/rust
rm -rf target/coverage/rust/html
LLVM_COV="$(mise where github:taiki-e/cargo-llvm-cov)/cargo-llvm-cov"
COVERAGE_IGNORE_REGEX='(^|[/\\])(tests|fixtures)([/\\]|$)|(^|[/\\])crates[/\\]finstack-ai-test([/\\]|$)'
"${LLVM_COV}" llvm-cov --workspace --locked \
  --ignore-filename-regex "${COVERAGE_IGNORE_REGEX}" \
  --lcov --output-path target/coverage/rust/lcov.info
"${LLVM_COV}" llvm-cov report \
  --ignore-filename-regex "${COVERAGE_IGNORE_REGEX}" \
  --html --output-dir target/coverage/rust
"""

[tasks.coverage-python]
description = "Generate Python helper and binding-smoke coverage under target/coverage/python"
run = """
set -euo pipefail
mkdir -p target/coverage/python/html
uv run --no-cache --isolated --no-project \
  --with-editable bindings/finstack-ai-python \
  --with pytest==9.1.1 \
  --with pytest-cov==7.1.0 \
  pytest \
  --cov \
  --cov-report=term-missing \
  --cov-report=html:target/coverage/python/html \
  --cov-report=xml:target/coverage/python/coverage.xml
"""

[tasks.coverage-wasm]
description = "Scaffold WASM coverage artifact (pending real wasm-bindgen-test suite)"
run = """
set -euo pipefail
mkdir -p target/coverage/wasm
cat > target/coverage/wasm/PENDING.md <<'EOF'
# WASM coverage pending

Real WASM coverage is deferred until `finstack-ai-wasm` (and/or kernel-on-wasm
execution) has a `wasm-bindgen-test` or equivalent suite.

Until then:
- compile gate: `mise run check-wasm`
- this task writes this scaffold artifact and exits 0 so CI can upload it
EOF
"""

[tasks.coverage]
description = "Run Rust, Python, and WASM coverage tasks (diagnostic reports only)"
run = """
set -euo pipefail
mise run coverage-rust
mise run coverage-python
mise run coverage-wasm
"""

# Supply chain and secrets

[tasks.supply-chain]
description = "Run cargo-deny supply-chain policy (Eng Standards §9; TM-18)"
run = """
set -euo pipefail
echo "controls: Engineering Standards §9; Threat Model TM-18; Threat Model §§12-13"
"$(mise where github:EmbarkStudios/cargo-deny)/cargo-deny" check
"$(mise where github:EmbarkStudios/cargo-deny)/cargo-deny" --manifest-path fuzz/Cargo.toml check
normal_graph="$(cargo tree -p finstack-ai-kernel --edges normal,build --locked)"
case "${normal_graph}" in
  *proptest*|*libfuzzer-sys*)
    echo "fuzz/property dependency leaked into the normal kernel graph" >&2
    exit 1
    ;;
esac
"""

[tasks.secret-scan]
description = "Scan repository history and tree for secrets (SEC-INV-005; TM-04)"
run = """
echo "controls: Engineering Standards §8; SEC-INV-005; Threat Model TM-04; Threat Model §§10,13.1"
gitleaks detect --source . --config .gitleaks.toml --verbose --redact --no-banner
"""

[tasks.secret-scan-canary]
description = "Prove secret scan fails on temporary example/fixture canaries"
run = """
echo "controls: Engineering Standards §8; SEC-INV-005; Threat Model TM-04; Threat Model §§10,13.1"
uv run --no-project python tools/security/secret_canary.py
"""

# Release smoke

[tasks.release-smoke]
description = "Build and package the private CI release-smoke binary"
run = "uv run --no-project python tools/ci/release.py smoke"

[tasks.release-reproducible]
description = "Compare two clean Linux release builds of the CI smoke binary"
run = "uv run --no-project python tools/ci/release.py reproducible"

# Nightly and aggregates

[tasks.check-nightly]
description = "Compile the workspace with the pinned dated Rust nightly"
run = """
rustup toolchain install nightly-2026-08-01 --profile minimal --component rustfmt --component clippy
rustup target add --toolchain nightly-2026-08-01 wasm32-unknown-unknown
cargo +nightly-2026-08-01 check --workspace --all-targets --locked
cargo +nightly-2026-08-01 check -p finstack-ai-wasm --target wasm32-unknown-unknown --locked
cargo +nightly-2026-08-01 check --manifest-path fuzz/Cargo.toml --all-targets --locked
"""

[tasks.test-miri]
description = "Run representative unsafe-free kernel core paths under pinned Miri"
run = """
set -euo pipefail
rustup toolchain install nightly-2026-08-01 --profile minimal
rustup component add --toolchain nightly-2026-08-01 miri rust-src
if rg -n '\bunsafe\b' crates/finstack-ai-kernel crates/finstack-ai-runtime; then
  echo 'kernel/runtime source unexpectedly contains unsafe code'
  exit 1
fi
cargo +nightly-2026-08-01 miri test -p finstack-ai-kernel --lib raw_json::tests::parse_canonicalizes_and_shares_bytes_on_clone --locked -- --exact
cargo +nightly-2026-08-01 miri test -p finstack-ai-kernel --lib reducer::apply::tests::semantic_tampering_precedes_capacity_failure --locked -- --exact
cargo +nightly-2026-08-01 miri test -p finstack-ai-kernel --lib reducer::fingerprint::tests::semantically_equal_canonical_raw_json_has_equal_fingerprints --locked -- --exact
"""

[tasks.fuzz-smoke]
description = "Run deterministic bounded smoke campaigns for every kernel fuzz target"
run = """
set -euo pipefail
rustup toolchain install nightly-2026-08-01 --profile minimal
for target in record_replay_json kernel_transition_json run_event_json message_json; do
  cargo +nightly-2026-08-01 fuzz run "${target}" -- \
    -seed=1 \
    -runs=256 \
    -max_total_time=15 \
    -timeout=5 \
    -max_len=1048576 \
    -rss_limit_mb=2048
done
"""

[tasks.fuzz]
description = "Run ten-minute campaigns for every kernel fuzz target"
run = """
set -euo pipefail
rustup toolchain install nightly-2026-08-01 --profile minimal
for target in record_replay_json kernel_transition_json run_event_json message_json; do
  cargo +nightly-2026-08-01 fuzz run "${target}" -- \
    -seed=1 \
    -max_total_time=600 \
    -timeout=10 \
    -max_len=5242880 \
    -rss_limit_mb=2048
done
"""

[tasks.ci]
description = "Run the local CI aggregate used by contributors"
run = """
set -euo pipefail
mise run format
mise run clippy
mise run test
mise run docs
mise run check-minimal
mise run architecture
mise run check-wasm
mise run lint-ci
mise run format-ci
mise run test-ci
mise run lint-schema-governance
mise run format-schema-governance
mise run test-schema-governance
mise run schema-governance
mise run lint-benchmark
mise run format-benchmark
mise run test-benchmark
uv run --no-project python tools/benchmark/run.py compile
mise run lint-workflows
mise run supply-chain
mise run secret-scan
mise run secret-scan-canary
mise run release-smoke
mise run test-pr027
"""

# Build tasks

[tasks.build-python]
description = "Build the Python wheel and sdist with pinned hashed maturin"
env = { CARGO_INCREMENTAL = "0", PYTHONDONTWRITEBYTECODE = "1", SOURCE_DATE_EPOCH = "315532800" }
run = """
uv build \
  --project bindings/finstack-ai-python \
  --out-dir target/python-dist \
  --clear \
  --no-create-gitignore \
  --build-constraints bindings/finstack-ai-python/constraints-build.txt \
  --require-hashes
"""

[tasks.python-develop]
description = "Open an isolated shell-ready Python environment with the binding installed editable"
run = """
uv run --no-cache --isolated --no-project \
  --with-editable bindings/finstack-ai-python \
  python -c 'import finstack_ai; print(finstack_ai.build_metadata())'
"""

[tasks.lint-python-binding]
description = "Lint Python package, tests, and artifact checker"
run = """
uv run --no-project --with ruff==0.12.11 ruff check \
  bindings/finstack-ai-python/python \
  bindings/finstack-ai-python/tests \
  tools/python_package
uv run --no-project --with ruff==0.12.11 ruff format --check \
  bindings/finstack-ai-python/python \
  bindings/finstack-ai-python/tests \
  tools/python_package
"""

[tasks.typecheck-python-binding]
description = "Strictly type-check the Python package and artifact checker"
run = """
uv run --isolated --no-project \
  --with mypy==2.3.0 \
  mypy --strict \
    bindings/finstack-ai-python/python \
    tools/python_package
"""

[tasks.test-python-binding]
description = "Run Python import, metadata, typing, and side-effect smoke tests"
run = """
uv run --no-cache --isolated --no-project \
  --with-editable bindings/finstack-ai-python \
  --with pytest==9.1.1 \
  pytest bindings/finstack-ai-python/tests -q
"""

[tasks.test-python-wheel]
description = "Install the built wheel without a compiler and run its smoke tests"
run = """
set -euo pipefail
set -- target/python-dist/*.whl
if [ "$#" -ne 1 ]; then
  echo 'expected exactly one built wheel in target/python-dist' >&2
  exit 1
fi
uv run --isolated --no-project \
  --with "$1" \
  --with pytest==9.1.1 \
  pytest bindings/finstack-ai-python/tests -q
"""

[tasks.build-python-wheel-ci]
description = "Build one native macOS or Windows wheel for the hosted CPython matrix"
env = { CARGO_INCREMENTAL = "0", PYTHONDONTWRITEBYTECODE = "1", SOURCE_DATE_EPOCH = "315532800" }
run = """
set -euo pipefail
: "${PYTHON_VERSION:?PYTHON_VERSION is required}"
: "${PYTHON_DIST_DIR:?PYTHON_DIST_DIR is required}"
uv python install "${PYTHON_VERSION}"
interpreter="$(uv python find "${PYTHON_VERSION}")"
resolved_cargo="$(command -v cargo)"
case "$(uname -s)" in
  MINGW*|MSYS*) resolved_cargo="$(cygpath -w "$(command -v cargo.exe)")" ;;
esac
export CARGO="${resolved_cargo}"
"${CARGO}" --version
uv run --no-project --with maturin==1.14.1 maturin build \
  --manifest-path bindings/finstack-ai-python/Cargo.toml \
  --release \
  --locked \
  --interpreter "${interpreter}" \
  --out "${PYTHON_DIST_DIR}"
"""

[tasks.smoke-python-wheel-ci]
description = "Install and smoke one hosted per-interpreter wheel"
run = """
set -euo pipefail
: "${PYTHON_VERSION:?PYTHON_VERSION is required}"
: "${PYTHON_DIST_DIR:?PYTHON_DIST_DIR is required}"
uv python install "${PYTHON_VERSION}"
set -- "${PYTHON_DIST_DIR}"/*.whl
if [ "$#" -ne 1 ]; then
  echo "expected exactly one wheel in ${PYTHON_DIST_DIR}" >&2
  exit 1
fi
case "$1" in
  *abi3*)
    echo 'classic abi3 wheel is prohibited by ADR-018' >&2
    exit 1
    ;;
esac
uv run --python "${PYTHON_VERSION}" --isolated --no-project \
  --with "$1" \
  --with pytest==9.1.1 \
  pytest bindings/finstack-ai-python/tests -q
"""

[tasks.build-python-sdist-ci]
description = "Build the hosted Python source distribution"
env = { PYTHONDONTWRITEBYTECODE = "1", SOURCE_DATE_EPOCH = "315532800" }
run = """
uv build \
  --project bindings/finstack-ai-python \
  --sdist \
  --out-dir target/python-sdist \
  --clear \
  --no-create-gitignore \
  --build-constraints bindings/finstack-ai-python/constraints-build.txt \
  --require-hashes
"""

[tasks.stage-python]
description = "Build twice and validate reproducible Python release artifacts"
env = { CARGO_INCREMENTAL = "0", PYTHONDONTWRITEBYTECODE = "1", SOURCE_DATE_EPOCH = "315532800" }
run = """
set -euo pipefail
uv build \
  --project bindings/finstack-ai-python \
  --out-dir target/python-stage-a \
  --clear \
  --no-create-gitignore \
  --build-constraints bindings/finstack-ai-python/constraints-build.txt \
  --require-hashes
uv build \
  --project bindings/finstack-ai-python \
  --out-dir target/python-stage-b \
  --clear \
  --no-create-gitignore \
  --build-constraints bindings/finstack-ai-python/constraints-build.txt \
  --require-hashes
uv run --no-project python tools/python_package/check.py \
  target/python-stage-a target/python-stage-b
"""

[tasks.test-pr027]
description = "Run PR-027 native module, package, dependency, and release proofs"
run = """
set -euo pipefail
cargo test -p finstack-ai-python --locked
cargo clippy -p finstack-ai-python --all-targets --locked -- -D warnings
mise run lint-python-binding
mise run typecheck-python-binding
mise run test-python-binding
mise run build-python
mise run test-python-wheel
mise run stage-python
python_graph="$(cargo tree -p finstack-ai-python -e normal,build --locked)"
case "${python_graph}" in
  *pyo3*) ;;
  *)
    echo 'Python binding graph must link PyO3' >&2
    exit 1
    ;;
esac
case "${python_graph}" in
  *finstack-ai-provider-openai-compatible*) ;;
  *)
    echo 'Python binding graph must link the OpenAI-compatible provider' >&2
    exit 1
    ;;
esac
for package in finstack-ai-kernel finstack-ai-runtime; do
  if cargo tree -p "${package}" -e normal,build --locked | grep -Eq 'pyo3|finstack-ai-python'; then
    echo "${package} unexpectedly includes Python binding dependencies" >&2
    exit 1
  fi
done
mise run architecture
"""
