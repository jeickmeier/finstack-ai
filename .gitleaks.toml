# Repository secret-scan policy for PR-003.
# Controls: Engineering Standards §8; SEC-INV-005; Threat Model TM-04; Threat Model §§10,13.1.
#
# Intentionally no path allowlist for examples/, fixtures/, or lockfiles.
# Committed trees must remain free of credential-shaped material. Negative
# proof uses temporary repositories created by `mise run secret-scan-canary`.

title = "finstack-ai secret scan"

[extend]
useDefault = true

[[rules]]
id = "finstack-canary-credential"
description = "Detects finstack CI canary credential material that must never be committed"
regex = '''finstack_canary_[0-9A-Za-z]{40,}'''
tags = ["finstack", "canary", "credential"]

[allowlist]
description = "Non-secret documentation markers only (no path exclusions)"
regexTarget = "match"
regexes = [
    '''secret://[A-Za-z0-9._/-]+''',
    '''\[REDACTED\]''',
    # Frozen public PR-009 `kernel-state` compatibility vector, not a credential.
    '''^public-Rust-API state: `58a34b469371d122d76c71740cf6aa2c5b246788239e965e09e750a6386a493c`$''',
]
