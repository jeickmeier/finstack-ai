sonar.projectKey=jeickmeier_finstack-ai
sonar.organization=jeickmeier-1


# The source root is the repository: Rust, Python, hand-authored WASM
# TypeScript, and in-tree tests. Setting sonar.tests drops the implicit
# source root, so sonar.sources must stay set or the scan indexes only the
# test paths and SonarQube Cloud reports the project as empty. sonar.tests
# does not accept wildcards. The same pytest paths are excluded from sources:
# an overlapping path is indexed twice and the scan fails. Rust tests and
# WASM *.test.ts files stay in the source root. scripts/ci/test_*.py are CI
# runners, not pytest modules, and stay main code.
# Generated trees stay out: wasm-bindgen glue, the compiled WASM package
# dist, and WIT bindgen. JSON is data, not scanned source.
sonar.sources=.
sonar.exclusions=\
  **/*.json,\
  bindings/finstack-ai-wasm/js/generated/**,\
  bindings/finstack-ai-wasm/js/dist/**,\
  plugins/finstack-ai-wit/src/generated.rs,\
  bindings/finstack-ai-python/tests/**,\
  examples/python-notebooks/test_knowledge_golden.py,\
  examples/python-notebooks/test_knowledge_search.py,\
  examples/python-notebooks/test_support.py,\
  scripts/benchmarks/test_search.py,\
  scripts/ci/test_merge_lcov.py,\
  scripts/compat/test_release_tag_preflight.py
sonar.tests=\
  bindings/finstack-ai-python/tests,\
  examples/python-notebooks/test_knowledge_golden.py,\
  examples/python-notebooks/test_knowledge_search.py,\
  examples/python-notebooks/test_support.py,\
  scripts/benchmarks/test_search.py,\
  scripts/ci/test_merge_lcov.py,\
  scripts/compat/test_release_tag_preflight.py
# Hosted CI merges native workspace coverage and kernel-on-WASM coverage
# into this report before the scan. Both inputs are Rust LCOV; the WASM
# report is the kernel wasm32 probe.
sonar.rust.lcov.reportPaths=target/coverage/lcov.info