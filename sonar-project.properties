sonar.projectKey=jeickmeier_finstack-ai
sonar.organization=jeickmeier-1


# wasm-bindgen output. Regenerated by `mise run build-wasm -- release`.
# Pytest modules are test code. sonar.tests does not accept wildcards, and the
# same paths are excluded from sources: the default source root is the project
# directory, so an overlapping path is indexed twice and the scan fails.
# scripts/ci/test_*.py are CI runners, not pytest modules, and stay main code.
sonar.exclusions=\
  bindings/finstack-ai-wasm/js/generated/**,\
  bindings/finstack-ai-python/tests/**,\
  examples/python-notebooks/test_knowledge_golden.py,\
  examples/python-notebooks/test_knowledge_search.py,\
  examples/python-notebooks/test_support.py,\
  scripts/benchmarks/test_search.py,\
  scripts/ci/test_merge_lcov.py,\
  scripts/compat/test_release_tag_preflight.py
sonar.tests=\
  bindings/finstack-ai-python/tests,\
  examples/python-notebooks/test_knowledge_golden.py,\
  examples/python-notebooks/test_knowledge_search.py,\
  examples/python-notebooks/test_support.py,\
  scripts/benchmarks/test_search.py,\
  scripts/ci/test_merge_lcov.py,\
  scripts/compat/test_release_tag_preflight.py
# Hosted CI merges native workspace coverage and kernel-on-WASM coverage
# into this report before the scan. Both inputs are Rust LCOV; the WASM
# report is the kernel wasm32 probe.
sonar.rust.lcov.reportPaths=target/coverage/lcov.info