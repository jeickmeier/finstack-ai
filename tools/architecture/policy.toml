# Architecture and dependency policy for PR-002.
# Diagnostics map to Engineering Standards ENG-ARCH-* / ENG-SEM-* where applicable.

[packages]
kernel = "finstack-ai-kernel"
runtime = "finstack-ai-runtime"
sdk = "finstack-ai"
protocol = "finstack-ai-protocol"
test = "finstack-ai-test"
wasm_binding = "finstack-ai-wasm"
python_binding = "finstack-ai-python"

# Path prefixes relative to the repository root (posix).
[classification]
kernel = ["crates/finstack-ai-kernel"]
runtime = ["crates/finstack-ai-runtime"]
sdk = ["crates/finstack-ai"]
protocol = ["crates/finstack-ai-protocol"]
test = ["crates/finstack-ai-test"]
binding = ["bindings/"]
provider = ["extensions/providers/"]
toolset = ["extensions/toolsets/"]
observer = ["extensions/observers/"]
store = ["extensions/stores/"]
plugin = ["plugins/"]
application = ["examples/"]
fixture = ["fixtures/"]
tooling = ["tools/"]

# Allowed workspace dependency edges: depender_role -> [dependency_roles]
[edges]
kernel = []
runtime = ["kernel"]
sdk = ["runtime", "kernel"]
protocol = ["kernel"]
test = ["kernel", "runtime"]
# Native bindings may compose curated provider and store leaf crates into their package;
# browser graph checks independently reject native-I/O dependencies.
binding = ["sdk", "provider", "store"]
provider = ["runtime"]
toolset = ["runtime"]
observer = ["runtime"]
store = ["kernel", "runtime", "protocol"]
plugin = ["runtime", "sdk", "protocol"]
application = ["sdk", "runtime", "protocol", "provider", "toolset", "observer", "store", "plugin"]
# Fixtures and tooling may depend on core packages for checks.
fixture = ["kernel", "runtime", "sdk", "protocol", "test"]
tooling = ["kernel", "runtime", "sdk", "protocol", "test"]

# Exact package names forbidden in the kernel dependency closure (direct or transitive).
[kernel.forbidden_exact]
names = [
  "tokio",
  "async-std",
  "smol",
  "reqwest",
  "hyper",
  "hyper-util",
  "rusqlite",
  "sqlx",
  "wasmtime",
  "wasmer",
  "pyo3",
  "wasm-bindgen",
  "clap",
  "ratatui",
  "mio",
  "socket2",
  "openssl",
  "native-tls",
  "rustls",
]

# Prefix matches for provider SDKs / exporters (crate name starts with).
[kernel.forbidden_prefixes]
prefixes = [
  "opentelemetry-",
  "aws-sdk-",
  "azure_",
  "google-cloud-",
]

# Packages forbidden in the resolved wasm32 browser graph rooted at finstack-ai-wasm.
[wasm.forbidden_exact]
names = [
  "tokio",
  "mio",
  "socket2",
  "openssl",
  "native-tls",
  "reqwest",
  "hyper",
  "rusqlite",
  "sqlx",
  "pyo3",
  "wasmtime",
  "wasmer",
]

[features]
runtime_default_must_be_empty = true
facade_default_features = ["native-tokio"]
facade_pass_through = { "native-tokio" = "finstack-ai-runtime/native-tokio", "wasm-host" = "finstack-ai-runtime/wasm-host" }
wasm_binding_required_features = ["wasm-host"]
wasm_binding_forbidden_features = ["native-tokio", "default"]

# Source scan roots (posix, relative). Fixtures under fixtures/architecture are excluded from production scans.
[source.roots]
include = [
  "crates/",
  "bindings/",
  "extensions/",
  "plugins/",
  "examples/",
]
exclude = [
  "fixtures/",
  "tools/",
  "target/",
  "docs/",
]

# Rules that cannot be waived via allowlist.
[exceptions]
non_waivable_check_ids = [
  "ARCH001", # kernel I/O / forbidden deps
  "ARCH002", # seventh-port / six-port contract ownership (source)
]
required_fields = [
  "id",
  "status",
  "check_id",
  "rule",
  "subject",
  "adr",
  "exception_id",
  "scope",
  "reason",
  "risk",
  "compensating_control",
  "owner",
  "approver",
  "created_on",
  "expires_on",
  "removal_issue",
  "public_compatibility_affected",
  "security_affected",
  "evidence",
]
